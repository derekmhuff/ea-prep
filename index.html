<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF3EA">
<title>EA Prep</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF3EA;--grid:#D7E3D0;--sheet:#FAFCF8;--ink:#1B2E4A;--muted:#55665F;--line:#C9D8C2;
  --hl:#FFE45C;--hl-ink:#1B2E4A;--ok:#2B7A4B;--ok-bg:#E1F1E6;--bad:#B23A32;--bad-bg:#F7E3E0;
  --accent:#1F4E8C;--accent-ink:#FFFFFF;--bar:#1F4E8C;--head:#FAFCF8;--head-ink:#1B2E4A;--nav:#FAFCF8;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --stem:var(--serif);
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body[data-mode=test]{
  --paper:#E8ECEF;--grid:transparent;--sheet:#FFFFFF;--ink:#1C2329;--muted:#5A6670;--line:#CBD3DA;
  --hl:#DCE8F2;--hl-ink:#1C2329;--accent:#2F6690;--accent-ink:#FFFFFF;--bar:#2F6690;
  --head:#26323C;--head-ink:#F1F4F6;--stem:var(--sans);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --paper:#0F1A16;--grid:#192820;--sheet:#15231D;--ink:#E3ECE6;--muted:#93A69C;--line:#2A3D34;
    --hl:#E6D24A;--hl-ink:#15180C;--ok:#6CC18F;--ok-bg:#183326;--bad:#F08A80;--bad-bg:#3A1E1B;
    --accent:#8DB7E8;--accent-ink:#0E1A2A;--bar:#8DB7E8;--head:#15231D;--head-ink:#E3ECE6;--nav:#15231D;color-scheme:dark;
  }
  :root:not([data-theme=light]) body[data-mode=test]{
    --paper:#11161B;--sheet:#1A2128;--ink:#E3E8EC;--muted:#9AA7B2;--line:#2C3640;
    --hl:#23384A;--hl-ink:#E3E8EC;--accent:#7FB2DD;--accent-ink:#0D1620;--bar:#7FB2DD;--head:#0D1318;--head-ink:#E3E8EC;
  }
}
:root[data-theme=dark]{
  --paper:#0F1A16;--grid:#192820;--sheet:#15231D;--ink:#E3ECE6;--muted:#93A69C;--line:#2A3D34;
  --hl:#E6D24A;--hl-ink:#15180C;--ok:#6CC18F;--ok-bg:#183326;--bad:#F08A80;--bad-bg:#3A1E1B;
  --accent:#8DB7E8;--accent-ink:#0E1A2A;--bar:#8DB7E8;--head:#15231D;--head-ink:#E3ECE6;--nav:#15231D;color-scheme:dark;
}
:root[data-theme=dark] body[data-mode=test]{
  --paper:#11161B;--sheet:#1A2128;--ink:#E3E8EC;--muted:#9AA7B2;--line:#2C3640;
  --hl:#23384A;--hl-ink:#E3E8EC;--accent:#7FB2DD;--accent-ink:#0D1620;--bar:#7FB2DD;--head:#0D1318;--head-ink:#E3E8EC;
}
html,body{min-height:100%}
body{
  margin:0;color:var(--ink);background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%;
}
body[data-mode=test]{background-image:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:54px;padding:8px 16px;background:var(--head);color:var(--head-ink);border-bottom:1px solid var(--line)}
.top .hr{display:flex;align-items:center;gap:12px}
.brand{font-family:var(--serif);font-size:1.25rem;font-weight:600;letter-spacing:-.01em}
.hbtn{background:none;border:1px solid currentColor;border-radius:8px;padding:6px 12px;font-size:14px;font-weight:600;min-height:36px}
.tsec{font-size:14px;opacity:.85}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.05rem;padding:4px 10px;border-radius:6px;background:rgba(127,127,127,.18)}
.timer.low{background:#B5651D;color:#fff}
main{max-width:620px;margin:0 auto;padding:20px 16px 130px}
h1{font-family:var(--serif);font-weight:500;font-size:2.1rem;line-height:1.1;letter-spacing:-.02em;margin:8px 0 6px}
body[data-mode=test] h1{font-family:var(--sans);font-weight:700;font-size:1.7rem;letter-spacing:-.01em}
h2{font-size:1.1rem;font-weight:700;margin:0 0 6px}
p{margin:0 0 10px}
.sub{color:var(--muted);margin-bottom:0}
.small{font-size:14px;color:var(--muted)}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:16px;margin:18px 0;box-shadow:0 2px 0 -1px var(--sheet),0 2px 0 0 var(--line),0 5px 0 -2px var(--sheet),0 5px 0 -1px var(--line)}
body[data-mode=test] .sheet{border-radius:6px;box-shadow:none}
.today{border-left:6px solid var(--hl)}
.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.ring{flex:none;text-align:center;font-size:12px;color:var(--muted)}
.ring svg{display:block;margin:0 auto 2px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.btn{font-weight:600;font-size:15px;padding:11px 16px;min-height:46px;border-radius:10px;border:1.5px solid var(--ink);background:transparent;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:default}
.btn.wide{flex:1}
body[data-mode=test] .btn{border-radius:4px;border-width:1px}
.secbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.secbtns .btn{padding:10px 6px}
.skills{list-style:none;padding:0;margin:8px 0 0}
.skill{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 2px}
.skill .nm{font-weight:600}
.skill .lv{grid-column:1;font-size:13px;color:var(--muted)}
.skill .go{grid-row:1/3;grid-column:2;font-size:14px;font-weight:600;color:var(--accent)}
.meter{display:inline-flex;gap:3px;vertical-align:middle;margin-right:8px}
.meter i{width:18px;height:6px;border-radius:3px;background:var(--line)}
.meter i.on{background:var(--ok)}
.secname{font-family:var(--serif);font-size:1.15rem;font-weight:600;margin:22px 0 0}
body[data-mode=test] .secname{font-family:var(--sans);font-size:1rem}
.qtype{font-size:13px;color:var(--muted);margin-bottom:12px}
.stim{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:14px;margin:0 0 18px}
.slabel{font-weight:700;font-size:14px;margin-bottom:8px}
.passage{font-family:var(--stem);font-size:1.04rem;line-height:1.65}
.passage p{margin:0 0 12px}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;font-size:14px;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
.stim th button{background:none;border:0;padding:0;font-weight:700;text-align:left;white-space:normal;min-width:70px}
.stim th button span{font-weight:400;color:var(--muted);margin-left:4px}
.bars{font-size:14px}
.bar{display:grid;grid-template-columns:88px 1fr 56px;align-items:center;gap:8px;margin:6px 0}
.bt{height:18px;background:var(--line);border-radius:2px;overflow:hidden}
.bf{display:block;height:100%;background:var(--bar)}
.bv{font-variant-numeric:tabular-nums;text-align:right}
.tabbar{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px -4px 12px;overflow-x:auto}
.tabbar button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;font-weight:600;font-size:14px;white-space:nowrap;color:var(--muted)}
.tabbar button.on{border-color:var(--accent);color:var(--ink)}
.stem p{font-family:var(--stem);font-size:1.12rem;line-height:1.55}
body[data-mode=test] .stem p{font-size:1.02rem}
.stem u{text-decoration-thickness:2px;text-underline-offset:3px}
.ds{margin:8px 0 14px;font-family:var(--stem);font-size:1.05rem}
.ds div{margin:6px 0;padding-left:34px;text-indent:-34px}
.ds b{display:inline-block;width:34px;text-indent:0}
select.gi{font:inherit;font-family:var(--sans);font-size:15px;padding:4px 6px;margin:2px;border:1.5px solid var(--ink);border-radius:6px;background:var(--sheet);color:var(--ink);max-width:100%}
select.gi.ok{border-color:var(--ok);background:var(--ok-bg)}
select.gi.bad{border-color:var(--bad);background:var(--bad-bg)}
.ch{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;margin:8px 0;background:var(--sheet);border:1px solid var(--line);border-radius:10px;color:var(--ink)}
.ch .lt{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.ch.sel{background:var(--hl);color:var(--hl-ink);border-color:var(--ink)}
.ch.sel .lt{background:var(--hl-ink);color:var(--hl);border-color:var(--hl-ink)}
.ch.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ink)}
.ch.right .lt{background:var(--ok);border-color:var(--ok);color:#fff}
.ch.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--ink)}
.ch.wrong .lt{background:var(--bad);border-color:var(--bad);color:#fff}
.ch:disabled{cursor:default}
body[data-mode=test] .ch{border-radius:4px}
.intro{font-size:14px;color:var(--muted)}
.ynrow{border-bottom:1px solid var(--line);padding:10px 0}
.ynrow p{margin-bottom:8px}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.segb{background:var(--sheet);border:0;padding:8px 18px;font-weight:600;min-height:40px}
.segb+.segb{border-left:1.5px solid var(--ink)}
.segb.sel{background:var(--hl);color:var(--hl-ink)}
.segb.right{background:var(--ok);color:#fff}
.segb.wrong{background:var(--bad);color:#fff}
.tpa th{white-space:normal;font-size:13px}
.tpa td{white-space:normal;vertical-align:middle}
.tpa td:nth-child(-n+2){width:64px;text-align:center}
.tp{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;padding:0}
.tp.sel{background:var(--ink);box-shadow:inset 0 0 0 4px var(--sheet)}
.tp.right{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok)}
.tp.wrong{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad)}
.fb{background:var(--sheet);border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:4px;padding:14px 16px;margin:18px 0}
.fb.miss{border-left-color:var(--bad)}
.verdict{font-weight:700;font-size:1.05rem}
.trap{background:var(--bad-bg);padding:10px 12px;border-radius:6px}
.how{font-weight:700;margin:12px 0 4px}
.steps{margin:6px 0 0;padding-left:22px}
.steps li{margin:6px 0}
details summary{cursor:pointer;font-weight:600;color:var(--accent);margin-top:6px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;gap:10px;justify-content:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--sheet);border-top:1px solid var(--line)}
.dock .btn{flex:1;max-width:240px}
.tbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;font-size:14px;font-weight:600}
.tools{display:flex;gap:6px}
.tool{background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:6px 10px;font-size:13px;font-weight:600;min-height:36px}
.tool.on{background:#B5651D;color:#fff;border-color:#B5651D}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin:14px 0}
.cell{border:1px solid var(--line);background:var(--sheet);border-radius:4px;padding:10px 4px;text-align:center;font-weight:700;min-height:56px}
.cell small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.cell.ans{border-color:var(--accent)}
.cell.flag{box-shadow:inset 0 -4px 0 #B5651D}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--nav);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;background:none;border:0;padding:10px 4px 12px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;min-height:56px}
.tabs button i{width:22px;height:4px;border-radius:2px;background:transparent}
.tabs button.on{color:var(--ink)}
.tabs button.on i{background:var(--hl)}
.tabs button[data-go=test].on i{background:#2F6690}
.score{display:flex;align-items:baseline;gap:12px;margin:6px 0}
.score b{font-size:3rem;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.secrow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.secrow .v{font-weight:700;font-variant-numeric:tabular-nums}
.secrow .d{grid-column:1/3;font-size:13px;color:var(--muted)}
.rlist{list-style:none;padding:0;margin:0}
.rlist li button{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 2px;align-items:center}
.mark{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;background:var(--ok)}
.mark.x{background:var(--bad)}
.rlist .t{flex:1}
.rlist .s{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.mile{list-style:none;padding:0;margin:0}
.mile li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;color:var(--muted)}
.mile li.got{color:var(--ink)}
.mile li::before{content:"";flex:none;width:14px;height:14px;border:1.5px solid var(--line);border-radius:3px}
.mile li.got::before{background:var(--hl);border-color:var(--ink)}
label.f{display:block;margin:12px 0 4px;font-weight:600;font-size:14px}
.inp{font:inherit;padding:10px;border:1.5px solid var(--ink);border-radius:8px;background:var(--sheet);color:var(--ink);min-width:140px}
.fcard{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:28px 20px;min-height:220px;display:flex;flex-direction:column;justify-content:center}
.fcard .topic{font-size:13px;color:var(--muted)}
.fcard .front{font-family:var(--serif);font-size:1.4rem;line-height:1.35}
.fcard .back{border-top:1px dashed var(--line);padding-top:14px;margin-top:8px;font-size:1.05rem}
.calc{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(320px,92vw);background:var(--sheet);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.28);z-index:30;padding:10px}
.calc .disp{font-variant-numeric:tabular-nums;font-size:1.6rem;text-align:right;padding:6px 8px;border:1px solid var(--line);border-radius:4px;margin-bottom:8px;overflow:hidden}
.calc .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc .keys button{min-height:44px;border:1px solid var(--line);background:var(--paper);border-radius:4px;font-weight:600;font-size:17px}
.calc .ch2{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;margin-bottom:6px}
.scratch{position:fixed;inset:0;z-index:40;background:var(--sheet);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.scratch .sbar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);font-weight:600}
.scratch canvas{flex:1;touch-action:none;width:100%;display:block}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:grid;place-items:center;padding:20px}
.modal{background:var(--sheet);color:var(--ink);width:min(420px,100%);border-radius:10px;padding:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));z-index:60;background:var(--ink);color:var(--sheet);padding:10px 16px;border-radius:8px;font-size:14px;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.rules{padding-left:20px;margin:10px 0}
.track{display:flex;gap:6px;margin:4px 0 6px}
.track span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.track span.on{background:var(--accent)}
.wstep{background:var(--sheet);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:4px;padding:10px 14px;margin:12px 0}
.wstep p{margin:0 0 4px}
.wstep .why{color:var(--muted);font-size:14px}
.hint{background:var(--hl);color:var(--hl-ink);padding:10px 12px;border-radius:6px;margin-top:12px}
.linkbtn{background:none;border:0;padding:4px 0;margin-right:12px;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-align:left}
.toast{display:flex;align-items:center;gap:12px;cursor:pointer}
.tclose{flex:none;background:none;border:1px solid currentColor;color:inherit;border-radius:6px;padding:4px 10px;font-size:13px;font-weight:600;min-height:32px}
.recap{border-left:6px solid var(--accent)}
.recap .delta{font-size:14px;color:var(--muted)}
.qotd .qa{margin-top:6px}
.qotd .stem p{font-size:1.04rem}
.rules li{margin:6px 0}
.hide{display:none!important}
@media (prefers-reduced-motion:no-preference){.ch,.segb,.tp{transition:background-color .12s,border-color .12s}}
</style>
</head>
<body data-mode="prep">
<header class="top"><div class="hl" id="hl"></div><div class="hr" id="hr"></div></header>
<main id="app"></main>
<nav class="tabs" id="tabs" aria-label="Main">
  <button data-go="learn"><i></i>Learn</button>
  <button data-go="prep"><i></i>Exam preparation</button>
  <button data-go="test"><i></i>Practice test</button>
  <button data-go="progress"><i></i>Progress</button>
</nav>
<div id="layer"></div>
<script>
/*DATA-START*/
const DS_CH=["Statement (1) alone is sufficient, but statement (2) alone is not.","Statement (2) alone is sufficient, but statement (1) alone is not.","Both statements together are sufficient, but neither alone is.","Each statement alone is sufficient.","Statements (1) and (2) together are not sufficient."];
const YN=["Yes","No"];
const SECS={
  IR:{name:"Integrated Reasoning",short:"IR",mods:[6,6],thr:4,pace:150,calc:true},
  V:{name:"Verbal Reasoning",short:"Verbal",mods:[7,7],thr:5,pace:129,calc:false},
  Q:{name:"Quantitative Reasoning",short:"Quant",mods:[7,7],thr:5,pace:129,calc:false}
};
const ORDER=["IR","V","Q"];
const TYPES={
  TA:{n:"Table Analysis",s:"IR"},GI:{n:"Graphics Interpretation",s:"IR"},TPA:{n:"Two-Part Analysis",s:"IR"},MSR:{n:"Multi-Source Reasoning",s:"IR"},
  SC:{n:"Sentence Correction",s:"V"},CR:{n:"Critical Reasoning",s:"V"},RC:{n:"Reading Comprehension",s:"V"},
  PS:{n:"Problem Solving",s:"Q"},DS:{n:"Data Sufficiency",s:"Q"}
};
const STIM={
  ta1:{kind:"table",title:"Regional performance, fiscal year 2026",cols:["Region","Revenue ($M)","Change vs. 2025 (%)","Employees","Customer satisfaction (1–10)"],
    rows:[["North","48.2","+6","310","7.8"],["South","35.6","−3","260","8.4"],["East","52.9","+11","395","7.1"],["West","29.4","+15","180","8.9"],["Central","41.0","+2","290","7.6"],["Mountain","18.7","−8","140","8.1"]]},
  ta2:{kind:"table",title:"Project portfolio status",cols:["Project","Budget ($K)","Spent to date ($K)","Complete (%)","Team size"],

  rc1:{kind:"text",title:"Passage",html:"<p>For much of the twentieth century, economists assumed that the productivity gains from a new technology would show up quickly in aggregate statistics. The spread of electricity through American factories challenged that assumption. Although electric motors were widely available by 1900, measured manufacturing productivity grew slowly for nearly two decades.</p><p>Economic historians have argued that the delay was not a failure of the technology but a consequence of how firms first used it. Early adopters simply replaced a single large steam engine with a single large electric motor, leaving the factory’s layout—long drive shafts and multistory buildings arranged around a central power source—unchanged. Only when a new generation of plants was designed around small motors attached to individual machines did the advantages become visible: single-story layouts, flexible workflows, and fewer stoppages when one machine failed.</p><p>Some commentators draw a direct lesson for firms adopting artificial intelligence today: expect a lag, because the payoff depends on reorganizing work rather than on the tool itself. Critics caution that the analogy can be stretched too far. Redesigning factories meant replacing buildings that lasted decades, whereas software-based processes can be revised far more quickly. If the critics are right, any lag today should be considerably shorter—though not necessarily absent.</p>"}

{id:"ir01",sec:"IR",type:"TA",sub:"Reading tables",d:3,stim:"ta1",kind:"yn",stem:"Consider the table of regional performance.",

{id:"ir02",sec:"IR",type:"TA",sub:"Medians and totals",d:4,stim:"ta1",kind:"yn",stem:"Consider the table of regional performance.",

{id:"ir04",sec:"IR",type:"GI",sub:"Percent change from charts",d:3,stim:"gi1",kind:"gi",

{id:"ir05",sec:"IR",type:"GI",sub:"Averages from charts",d:3,stim:"gi1",kind:"gi",

{id:"ir07",sec:"IR",type:"TPA",sub:"Linear equations",d:3,kind:"tpa",

{id:"ir08",sec:"IR",type:"TPA",sub:"Strengthen and weaken",d:4,kind:"tpa",

{id:"ir09",sec:"IR",type:"TPA",sub:"Weighted returns",d:4,kind:"tpa",

{id:"ir11",sec:"IR",type:"MSR",sub:"Combining sources",d:4,stim:"msr1",kind:"yn",stem:"Use all three tabs.",

/* ---------- Verbal: Sentence Correction ---------- */
{id:"v01",sec:"V",type:"SC",sub:"Subject–verb agreement",d:2,
 stem:"The list of recommended vendors, along with the pricing notes from last quarter, <u>were sent</u> to the regional managers on Monday.",
 ch:["were sent","was sent","have been sent","are being sent","were being sent"],a:1,
 traps:{0:"“Notes” sits right before the verb, but it’s inside the “along with” phrase. The real subject is “list.”"},
 steps:["Find the subject. Cross out the phrase between the commas: “The list … were sent.”","“Along with the pricing notes” is an add-on phrase; it never makes a subject plural.","A singular subject (“list”) needs a singular verb: “was sent.” Every other choice uses a plural verb."]},
{id:"v02",sec:"V",type:"SC",sub:"Modifiers",d:3,
 stem:"<u>Having reviewed the quarterly forecasts, the budget was revised by the finance committee</u> before the board meeting.",
 ch:["Having reviewed the quarterly forecasts, the budget was revised by the finance committee","Having reviewed the quarterly forecasts, the finance committee revised the budget","After having reviewed the quarterly forecasts, the budget was revised by the finance committee","The finance committee, the quarterly forecasts having been reviewed, revised the budget","Reviewing the quarterly forecasts, the budget was revised by the finance committee"],a:1,
 traps:{0:"The passive voice puts “the budget” right after the modifier, so the sentence says the budget reviewed the forecasts.",4:"Switching to “Reviewing” doesn’t fix anything — the budget still can’t review forecasts."},
 steps:["“Having reviewed the quarterly forecasts” describes whoever did the reviewing.","The noun right after the comma must be that reviewer. In A, C, and E it’s “the budget.”","B puts “the finance committee” right after the modifier, in clear active voice.","D is grammatical but awkward, and it no longer says who reviewed the forecasts."]},
{id:"v03",sec:"V",type:"SC",sub:"Parallelism",d:3,
 stem:"The new onboarding program is designed to shorten training time, <u>reducing early turnover, and to improve</u> employee satisfaction.",
 ch:["reducing early turnover, and to improve","to reduce early turnover, and to improve","reduce early turnover, and improving","to reduce early turnover, and improving","reducing early turnover, and improving"],a:1,
 traps:{0:"“Reducing” breaks the list’s pattern. It reads like a side effect instead of a third goal."},
 steps:["Spot the list: the program is designed (1) to shorten…, (2) …, and (3) … improve.","Items in a list share a grammatical form. The first item sets it: “to shorten.”","Only B makes all three infinitives: to shorten, to reduce, to improve."]},
{id:"v04",sec:"V",type:"SC",sub:"Pronouns",d:3,
 stem:"When the two firms merged, <u>they found that its accounting systems were</u> incompatible, so the integration took longer than expected.",
 ch:["they found that its accounting systems were","it was found that their accounting systems were","the firms found that their accounting systems were","the firms found that its accounting systems was","they found that their accounting system were"],a:2,
 traps:{0:"“Its” is singular, but it refers to the two firms. Plural antecedents need “their.”",1:"“It was found” is vague passive voice — found by whom? C says it directly."},
 steps:["Match each pronoun to its antecedent. The systems belong to “the two firms,” which is plural.","So the possessive must be “their,” not “its.” That removes A and D.","E has “system were,” a subject–verb mismatch. B is grammatical but vague passive voice.","C is clear, active, and consistent."]},
{id:"v05",sec:"V",type:"SC",sub:"Comparisons",d:4,
 stem:"<u>Unlike the European market, where consumers</u> prefer smaller vehicles, buyers in the North American market favor trucks and SUVs.",
 ch:["Unlike the European market, where consumers","Unlike consumers in the European market, who","Unlike in the European market, where consumers","As opposed to the European market, in which consumers","Unlike those of the European market, consumers who"],a:1,
 traps:{0:"This compares a market to buyers. A comparison has to put like things side by side: people with people."},
 steps:["Find what’s being compared. The main clause is about “buyers in the North American market.”","So the “unlike” phrase must also name people.","B compares consumers with buyers. A and D compare a market with buyers; C and E are garbled."]},
{id:"v06",sec:"V",type:"SC",sub:"Verb tense",d:3,

{id:"v07",sec:"V",type:"SC",sub:"Idioms",d:4,

/* ---------- Verbal: Critical Reasoning ---------- */
{id:"v08",sec:"V",type:"CR",sub:"Weaken",d:3,
 stem:"A regional hospital network introduced a mandatory 10-minute huddle at the start of every nursing shift. In the six months that followed, reported medication errors fell 30% compared with the previous six months. Administrators conclude that the huddles reduced medication errors. Which of the following, if true, most seriously weakens the administrators’ conclusion?",
 ch:["The huddles also covered staffing assignments and discharge plans.","During the same period, the network replaced its paper medication records with an electronic barcode-scanning system.","Some nurses said the huddles made their shifts feel rushed.","Medication error rates at hospitals outside the network stayed about the same.","Nurses had requested shift huddles for several years before they were introduced."],a:1,
 traps:{3:"Flat error rates elsewhere rule out an industry-wide trend. That actually supports the huddles."},
 steps:["Conclusion: the huddles caused the drop. Evidence: errors fell after the huddles started.","To weaken a cause-and-effect claim, look for another cause that happened at the same time.","A barcode-scanning system is a direct error-prevention tool launched in the same window. The drop may be due to it, not the huddles."]},
{id:"v09",sec:"V",type:"CR",sub:"Assumption",d:3,
 stem:"Our software firm should move its annual sales conference online. Last year, the in-person conference cost $400,000, and an online version would cost less than $80,000. Therefore, moving the conference online will increase the firm’s profitability. The argument depends on which of the following assumptions?",
 ch:["Most attendees prefer in-person conferences.","Moving online will not reduce sales by enough to outweigh the cost savings.","Other software firms have moved their conferences online.","The firm’s sales have grown in each of the last five years.","Last year’s in-person conference cost more than those of earlier years."],a:1,
 traps:{0:"Preferences matter only if they reduce sales. And if this were true, it would hurt the argument rather than support it."},
 steps:["Conclusion: profitability will rise. Evidence: costs will fall.","The gap: profit depends on revenue, too. The argument quietly assumes revenue won’t drop much.","Negation test: “Moving online will reduce sales by more than the savings.” The argument collapses, so B is required."]},
{id:"v10",sec:"V",type:"CR",sub:"Strengthen",d:3,
 stem:"Coffee chain Q added a mobile ordering app in half of its stores. Average wait times in those stores fell 40%, while wait times in its other stores did not change. Management concludes that the app caused the drop. Which of the following, if true, most strengthens management’s conclusion?",
 ch:["Customers who use the app tend to be younger than those who don’t.","Several competing chains launched ordering apps during the same period.","The stores that received the app were chosen at random from stores of similar size and traffic.","The app cost more to build than projected.","Before the launch, stores without the app had slightly longer waits than stores that later got it."],a:2,
 traps:{1:"Competitors’ apps would affect all of Q’s stores, if at all. It does nothing to explain the gap between Q’s two groups."},
 steps:["Conclusion: the app caused wait times to fall. Evidence: app stores improved 40%; the others didn’t.","The main threat: the app stores may have been different to begin with — quieter, newer, better staffed.","Random selection from similar stores rules out that alternative, leaving the app as the likely cause."]},
{id:"v11",sec:"V",type:"CR",sub:"Inference",d:4,
 stem:"Last year, Company Z’s total revenue rose 10%, but revenue from its consulting division fell. The company has only two divisions: consulting and software. If these statements are true, which of the following must also be true?",
 ch:["Software accounts for more than half of the company’s revenue.","Consulting revenue fell by less than 10%.","The company’s profits rose last year.","Software revenue rose by more than 10%.","Consulting revenue is now less than half of software revenue."],a:3,
 traps:{0:"Possible, but not forced. A big enough jump in software works whether software started small or large."},
 steps:["Total = consulting + software. The total rose 10% while consulting fell.","If software had grown 10% or less while consulting shrank, the total would have grown by less than 10%.","So software must have grown by more than 10%. The other choices could be true, but nothing forces them; C is about profit, which the facts never mention."]},
{id:"v12",sec:"V",type:"CR",sub:"Flaw",d:4,
 stem:"Employees who attended the company’s optional leadership workshop were promoted at twice the rate of employees who did not. Therefore, requiring every employee to attend the workshop will double the company’s promotion rate. Which of the following identifies a flaw in the reasoning?",
 ch:["It ignores the cost of running the workshop for every employee.","It relies on data from a single company.","It overlooks the possibility that employees who chose to attend were already more likely to be promoted.","It assumes promotion is the only measure of a workshop’s value.","It fails to define what leadership means."],a:2,
 steps:["The evidence is a correlation: attendees were promoted at twice the rate.","Attendance was optional, so ambitious, high-performing people may be the ones who signed up.","If so, the workshop didn’t cause the promotions, and requiring it won’t double them — especially if promotion slots are limited."]},
{id:"v13",sec:"V",type:"CR",sub:"Explain a discrepancy",d:4,
 stem:"Over the past decade, the number of independent bookstores in Country X has increased, even though total book sales through physical stores have declined every year. Which of the following, if true, most helps explain this?",
 ch:["Online retailers have increased their share of total book sales.","The average price of books sold in physical stores has risen.","Most independent bookstores are located in large cities.","E-book sales have grown faster than print book sales.","Many independent bookstores have added cafés, events, and other offerings that now provide most of their income."],a:4,
 traps:{0:"This explains why in-store book sales are falling, but not why more independent stores are opening. A discrepancy answer must explain both sides."},
 steps:["Two facts to reconcile: more independent bookstores, yet falling in-store book sales.","The right answer shows how independents can thrive even as book sales shrink.","E does it: their income no longer depends mainly on selling books."]},
/* ---------- Verbal: Reading Comprehension ---------- */
{id:"v14",sec:"V",type:"RC",sub:"Main idea",d:3,stim:"rc1",
 stem:"The primary purpose of the passage is to",
 ch:["argue that electricity was less important to manufacturing than steam power","criticize firms that are slow to adopt new technologies","describe an explanation for a delayed productivity gain and consider how it applies to a current situation","predict how long the productivity lag from artificial intelligence will last","compare the operating costs of electric motors and steam engines"],a:2,
 traps:{3:"The passage says any lag should be shorter, not how long it will be. “Predict” overstates it."},
 steps:["Paragraph 1 sets up a puzzle: electricity spread, but productivity lagged.","Paragraph 2 gives historians’ explanation. Paragraph 3 applies it to AI and notes a critique.","C covers both halves. The others focus on details or go beyond what the passage claims."]},
{id:"v15",sec:"V",type:"RC",sub:"Detail",d:2,stim:"rc1",
 stem:"According to the passage, the productivity benefits of electricity became visible when",
 ch:["electric motors became cheaper than steam engines","firms replaced their single steam engine with a single electric motor","factories were designed around small motors attached to individual machines","economists changed how they measured productivity","multistory factory buildings became more common"],a:2,
 traps:{1:"That’s what early adopters did, and the passage says it produced little gain."},
 steps:["Detail questions are answered by a specific line. Go back to paragraph 2.","“Only when a new generation of plants was designed around small motors attached to individual machines did the advantages become visible.”","C restates that line."]},
{id:"v16",sec:"V",type:"RC",sub:"Inference",d:4,stim:"rc1",
 stem:"The critics mentioned in the third paragraph would most likely agree with which of the following?",
 ch:["Artificial intelligence will produce no productivity gains.","Firms adopting artificial intelligence will see no lag at all.","The factory analogy is entirely irrelevant to artificial intelligence.","How easily a process can be changed affects how long an adoption lag lasts.","Factory buildings should have been replaced more quickly."],a:3,
 traps:{1:"The passage says the lag should be shorter, “though not necessarily absent.” “No lag at all” goes too far."},
 steps:["The critics’ point: factories took decades to rebuild, but software processes can be revised quickly.","Their implied principle: the easier a process is to change, the shorter the lag.","D states that principle. B and C are too extreme; A and E aren’t discussed."]},
{id:"v17",sec:"V",type:"RC",sub:"Function",d:4,stim:"rc1",
 stem:"The author mentions “fewer stoppages when one machine failed” primarily to",
 ch:["show that electric motors were less reliable than steam engines","give an example of a benefit that came from designing factories around small motors","suggest that early adopters of electricity were careless","explain why productivity statistics were inaccurate","argue that single-story factories were safer"],a:1,
 steps:["Function questions ask why a detail is there. Read the sentence around it.","It appears in a list after “did the advantages become visible.”","So it’s an example of a benefit of the redesign — choice B."]},
/* ---------- Quant: Problem Solving ---------- */
{id:"q01",sec:"Q",type:"PS",sub:"Percents",d:2,
 stem:"A jacket’s price is increased by 20%, and then the new price is decreased by 20%. The final price is what percent of the original price?",
 ch:["80%","96%","98%","100%","104%"],a:1,
 traps:{3:"Both changes are 20%, but they apply to different bases ($100, then $120), so they don’t cancel."},
 steps:["Pick an easy starting price: $100.","A 20% increase gives $100 × 1.2 = $120.","A 20% decrease of $120 gives $120 × 0.8 = $96.","$96 is 96% of the original. Successive changes multiply: 1.2 × 0.8 = 0.96."]},
{id:"q02",sec:"Q",type:"PS",sub:"Ratios",d:3,
 stem:"A team has managers and analysts in a ratio of 3 to 8. After 4 more analysts are hired, the ratio becomes 1 to 3. How many managers are on the team?",
 ch:["9","12","15","18","24"],a:1,
 steps:["Write managers and analysts as 3k and 8k.","After 4 analysts join: 3k ÷ (8k + 4) = 1 ÷ 3.","Cross-multiply: 9k = 8k + 4, so k = 4.","Managers = 3k = 12. Check: 12 managers and 36 analysts is 1 to 3."]},
{id:"q03",sec:"Q",type:"PS",sub:"Rates and work",d:2,
 stem:"Printer A can print a batch of reports in 6 hours, and printer B can print the same batch in 3 hours. Working together at their constant rates, how many hours will the two printers take to print the batch?",
 ch:["1.5","2","2.5","3","4.5"],a:1,
 traps:{4:"Averaging the two times gives 4.5, but two printers together must be faster than either one alone."},
 steps:["Turn times into rates: A prints 1/6 of the batch per hour and B prints 1/3.","Add the rates: 1/6 + 2/6 = 1/2 of the batch per hour.","Time = 1 ÷ (1/2) = 2 hours.","Sanity check: together they must beat B’s 3 hours alone."]},
{id:"q04",sec:"Q",type:"PS",sub:"Averages",d:3,
 stem:"The average of five numbers is 18. When one of the numbers is removed, the average of the remaining four numbers is 16. What number was removed?",
 ch:["18","22","24","26","34"],a:3,
 traps:{0:"18 is the original average, not the removed number."},
 steps:["Convert averages to sums: 5 × 18 = 90.","The remaining four total 4 × 16 = 64.","The removed number is 90 − 64 = 26."]},
{id:"q05",sec:"Q",type:"PS",sub:"Algebra",d:2,
 stem:"If 3x − 2y = 12 and x + y = 9, what is the value of x?",
 ch:["3","4","5","6","7"],a:3,
 steps:["From x + y = 9, y = 9 − x.","Substitute: 3x − 2(9 − x) = 12, so 3x − 18 + 2x = 12.","5x = 30, so x = 6. Check: y = 3, and 3(6) − 2(3) = 12."]},
{id:"q06",sec:"Q",type:"PS",sub:"Percents",d:4,
 stem:"In year 0, a company’s profit was 10% of its revenue. Revenue then rose 25% in year 1 and fell 20% in year 2. In year 2, profit was 12% of revenue. Year 2 profit was what percent of year 0 profit?",
 ch:["96%","100%","108%","120%","125%"],a:3,
 traps:{0:"96% treats +25% then −20% as a net loss. Multiply instead: 1.25 × 0.8 = 1, so revenue ends exactly where it started."},
 steps:["Let year 0 revenue be 100, so year 0 profit is 10.","Year 1 revenue: 100 × 1.25 = 125. Year 2 revenue: 125 × 0.8 = 100.","Year 2 profit: 12% of 100 = 12.","12 ÷ 10 = 120%. The revenue swings cancel, so only the margin change matters."]},
{id:"q07",sec:"Q",type:"PS",sub:"Word problems",d:3,
 stem:"A software subscription costs x dollars per month for the first 3 months and y dollars per month after that. One customer paid $190 for 8 months, and another paid $310 for 14 months. What is x?",
 ch:["20","25","30","35","40"],a:2,
 traps:{0:"20 is y, the later monthly price. Check which variable the question asks for."},
 steps:["8 months is 3 months at x plus 5 at y: 3x + 5y = 190.","14 months is 3 at x plus 11 at y: 3x + 11y = 310.","Subtract the equations: 6y = 120, so y = 20.","Then 3x = 190 − 100 = 90, so x = 30."]},
{id:"q08",sec:"Q",type:"PS",sub:"Statistics",d:3,
 stem:"The set {3, 7, 7, 10, x} has a mean equal to its median. What is x?",
 ch:["3","5","8","10","12"],a:2,
 steps:["Find the median first. Wherever x falls, the two 7s keep the middle (third) value at 7.","So the mean is 7, which means the sum is 5 × 7 = 35.","3 + 7 + 7 + 10 = 27, so x = 35 − 27 = 8."]},
{id:"q09",sec:"Q",type:"PS",sub:"Number properties",d:4,
 stem:"If n is a positive integer and n² is divisible by 72, what is the smallest possible value of n?",
 ch:["6","12","18","24","36"],a:1,
 traps:{0:"6² = 36, which is only half of 72."},
 steps:["Factor: 72 = 2³ × 3².","Every prime in a perfect square has an even exponent, so n² needs at least 2⁴ × 3².","So n needs at least 2² × 3 = 12.","Check: 12² = 144 = 2 × 72."]},
{id:"q10",sec:"Q",type:"PS",sub:"Counting and probability",d:5,
 stem:"A 3-person committee is chosen at random from 5 managers and 4 analysts. What is the probability that the committee has exactly 2 managers?",
 ch:["5/21","4/9","10/21","1/2","2/3"],a:2,
 steps:["Total committees: C(9, 3) = 84.","Favorable: choose 2 of 5 managers, C(5, 2) = 10, and 1 of 4 analysts, C(4, 1) = 4, for 10 × 4 = 40.","Probability = 40 ÷ 84 = 10/21."]},
{id:"q11",sec:"Q",type:"PS",sub:"Mixtures",d:4,
 stem:"A 40-liter solution is 25% concentrate. How many liters of pure concentrate must be added to make the solution 40% concentrate?",
 ch:["6","8","10","12","15"],a:2,
 traps:{0:"6 liters is 15% of 40 — the gap between 25% and 40% — but adding concentrate also increases the total volume."},
 steps:["Concentrate now: 25% of 40 = 10 liters.","Add x liters of pure concentrate: (10 + x) ÷ (40 + x) = 0.4.","10 + x = 16 + 0.4x, so 0.6x = 6 and x = 10.","Check: 20 ÷ 50 = 40%."]},
/* ---------- Quant: Data Sufficiency ---------- */
{id:"q12",sec:"Q",type:"DS",sub:"Algebra",d:2,stem:"What is the value of x?",s1:"2x + 3 = 11",s2:"x² = 16",a:0,
 traps:{3:"Statement (2) gives x = 4 or x = −4. Two possible values means not sufficient."},
 steps:["Statement (1): 2x = 8, so x = 4. One value: sufficient.","Statement (2): x could be 4 or −4. Not sufficient.","Answer A: statement (1) alone."]},
{id:"q13",sec:"Q",type:"DS",sub:"Number properties",d:3,stem:"If n is an integer, is n even?",s1:"3n is even.",s2:"n + 5 is odd.",a:3,
 steps:["(1): 3 is odd, so 3n is even only when n is even. Definite yes: sufficient.","(2): even + 5 is odd and odd + 5 is even, so n + 5 odd means n is even. Sufficient.","A definite yes or a definite no counts as sufficient. Each alone works: D."]},
{id:"q14",sec:"Q",type:"DS",sub:"Word problems",d:3,stem:"A store sold only shirts and hats yesterday. How many hats did it sell?",s1:"The store sold 40 items in total.",s2:"The store sold 3 times as many shirts as hats.",a:2,
 steps:["(1): shirts + hats = 40 has many solutions. Not sufficient.","(2): shirts = 3 × hats gives a ratio but no size. Not sufficient.","Together: 3h + h = 40, so h = 10. Sufficient together: C."]},
{id:"q15",sec:"Q",type:"DS",sub:"Inequalities",d:4,stem:"Is x > y?",s1:"x² > y²",s2:"x > 0",a:2,
 traps:{0:"Squares hide signs: x = −3 and y = 1 satisfy x² > y², yet x < y. Always test negatives."},
 steps:["(1): x = 3, y = 1 gives yes; x = −3, y = 1 gives no. Not sufficient.","(2): says nothing about y. Not sufficient.","Together: x² > y² means |x| > |y|. With x positive, x = |x| > |y| ≥ y. Sufficient: C."]},
{id:"q16",sec:"Q",type:"DS",sub:"Number properties",d:3,stem:"Is xy < 0?",s1:"x < 0",s2:"x ÷ y < 0",a:1,
 steps:["(1): y could be positive (yes) or negative (no). Not sufficient.","(2): a negative quotient means x and y have opposite signs, so the product is negative too. Definite yes: sufficient.","Answer B: statement (2) alone."]},
{id:"q17",sec:"Q",type:"DS",sub:"Sets and overlaps",d:4,stem:"Every respondent in a survey said whether they liked product A and whether they liked product B. 60% of respondents liked product A. How many respondents liked both products?",s1:"45% of respondents liked product B.",s2:"20% of respondents liked neither product.",a:4,
 traps:{2:"Together you can show 25% liked both — but the question asks how many people, and the number of respondents is never given."},
 steps:["Notice the question asks for a count of people, not a percentage.","Together: 80% liked at least one product, so both = 60% + 45% − 80% = 25%.","Without the total number of respondents, 25% can’t become a count. Not sufficient even together: E."]},
{id:"q18",sec:"Q",type:"DS",sub:"Remainders",d:5,stem:"k is a positive integer. What is the remainder when k is divided by 6?",s1:"When k is divided by 3, the remainder is 2.",s2:"When k is divided by 2, the remainder is 1.",a:2,
 steps:["(1): k could be 2, 5, 8, 11…, giving remainders of 2, 5, 2, 5 when divided by 6. Not sufficient.","(2): k is odd, so the remainder could be 1, 3, or 5. Not sufficient.","Together: odd numbers that leave remainder 2 when divided by 3 are 5, 11, 17…, all leaving remainder 5. Sufficient: C."]}

 {id:"c01",topic:"Sentence Correction",front:"“The list of vendors, along with the notes, ___ sent.” Was or were?",back:"Was. “Along with,” “as well as,” and “in addition to” never make a subject plural. Cross them out and match the verb to “list.”"},
 {id:"c02",topic:"Sentence Correction",front:"What must come right after an opening modifier like “Having reviewed the data,”?",back:"The person or thing that did the action. If “the report” comes next, the modifier dangles — reports don’t review data."},
 {id:"c03",topic:"Sentence Correction",front:"In a list, what has to match?",back:"Every item’s grammatical form: “to shorten, to reduce, and to improve” or “shortening, reducing, and improving,” never a mix."},
 {id:"c04",topic:"Sentence Correction",front:"“Unlike Europe, buyers in North America prefer trucks.” What’s wrong?",back:"It compares a place with people. Compare like with like: “Unlike consumers in Europe, buyers in North America…”"},
 {id:"c05",topic:"Sentence Correction",front:"When do you need the past perfect (“had done”)?",back:"When one past action finished before another past action: “By the time the rule was announced, the banks had already adjusted.”"},
 {id:"c06",topic:"Sentence Correction",front:"Complete the idiom: “not so much X ___ Y.”",back:"“Not so much X as Y.” Related pairs: “not only X but also Y,” “both X and Y,” “regard X as Y.”"},
 {id:"c07",topic:"Sentence Correction",front:"“It” or “they” for one company? For two firms?",back:"One company is “it/its.” Two firms are “they/their.” Each pronoun needs one clear antecedent that matches in number."},
 {id:"c08",topic:"Sentence Correction",front:"Fewer or less?",back:"Fewer for things you count (fewer errors). Less for amounts you measure (less time, less risk)."},
 {id:"c09",topic:"Critical Reasoning",front:"How do you test whether an answer is a required assumption?",back:"Negate it. If the negated statement makes the argument fall apart, it’s a required assumption."},
 {id:"c10",topic:"Critical Reasoning",front:"Fastest way to weaken a cause-and-effect claim?",back:"Show another cause that happened at the same time, or show the effect happened without the cause."},
 {id:"c11",topic:"Critical Reasoning",front:"What does a good “explain the discrepancy” answer do?",back:"Makes both surprising facts true at the same time. An answer that explains only one side is a trap."},
 {id:"c12",topic:"Critical Reasoning",front:"On must-be-true questions, which answers are usually wrong?",back:"Extreme or unsupported ones. The right answer follows strictly from the facts and is often modestly worded."},
 {id:"c13",topic:"Quant",front:"A price rises 20%, then falls 20%. Net change?",back:"Multiply the factors: 1.2 × 0.8 = 0.96, a 4% decrease. Never add successive percents."},
 {id:"c14",topic:"Quant",front:"Percent change formula?",back:"(New − Old) ÷ Old × 100. The base is always the starting value."},
 {id:"c15",topic:"Quant",front:"Two workers finish a job in a and b hours alone. How long together?",back:"Add rates: 1/a + 1/b. Time = ab ÷ (a + b)."},
 {id:"c16",topic:"Quant",front:"Fastest first move on an averages problem?",back:"Convert to sums: sum = average × count. Most average problems are sum problems in disguise."},
 {id:"c17",topic:"Data Sufficiency",front:"What do answers A to E mean?",back:"A: (1) only. B: (2) only. C: together only. D: each alone. E: not even together. Judge (1) and (2) separately before combining."},
 {id:"c18",topic:"Data Sufficiency",front:"Does a definite “no” count as sufficient?",back:"Yes. Sufficient means one definite answer: a single value, always yes, or always no."},
 {id:"c19",topic:"Quant",front:"If n² is divisible by 2³, what must n be divisible by?",back:"2². Primes in a perfect square have even exponents, so n² contains at least 2⁴, and n contains at least 2²."},
 {id:"c20",topic:"Quant",front:"Combinations: choosing k from n when order doesn’t matter?",back:"C(n, k) = n! ÷ (k! × (n − k)!). Example: C(9, 3) = 84."},
 {id:"c21",topic:"Integrated Reasoning",front:"Table Analysis: first move?",back:"Sort by the column each statement depends on. Judge every statement on its own; they’re independent."},
 {id:"c22",topic:"Integrated Reasoning",front:"Multi-Source Reasoning: how should you read the tabs?",back:"Skim each tab for what it contains, then return to the right tab per question. Watch for facts that only work when two tabs are combined."},
 {id:"c23",topic:"Integrated Reasoning",front:"Graphics Interpretation: the most common trap?",back:"Misreading what’s asked — a value versus a change, or a share versus a dollar amount. Check axis units and the total first."}

  rc2:{kind:"text",title:"Passage",html:"<p>When software firms began selling subscriptions in tiers, many expected customers to choose the cheapest plan that met their needs. Instead, firms observed that adding a premium tier—even one that few customers bought—shifted purchases toward the middle tier. Behavioral economists attribute this to anchoring: the expensive option makes the middle price seem moderate by comparison.</p><p>Some analysts argue that this effect is weaker in business purchasing than in consumer markets, because corporate buyers follow procurement rules, compare vendors systematically, and must justify spending to others. A recent study of 400 mid-sized firms complicates that view. It found that buyers shown a three-tier price sheet chose the middle tier 61 percent of the time, compared with 38 percent for buyers shown only the two lower tiers. However, the effect shrank sharply for purchases above the dollar threshold that triggered formal procurement review, suggesting that process, rather than the type of buyer, may be what limits anchoring.</p>"}

{id:"ir21",sec:"IR",type:"GI",sub:"Overlapping groups",d:5,stim:"gi4",kind:"gi",

{id:"ir22",sec:"IR",type:"TPA",sub:"Linear equations",d:3,kind:"tpa",

{id:"ir23",sec:"IR",type:"TPA",sub:"Assumption and weaken",d:4,kind:"tpa",
 stem:"An analyst wrote: “After our firm introduced flexible schedules, annual employee turnover fell from 18% to 11%. Flexible schedules therefore reduce turnover.” Select the assumption the argument requires and the statement that, if true, would most weaken it. Make only one selection in each column.",

 steps:["Conclusion: flexible schedules caused turnover to fall. Evidence: turnover fell after they started.","The argument requires that nothing else explains the drop. Negate the first option and the argument collapses.","A recession that dried up outside job openings is exactly that kind of alternative: people stayed because leaving was harder.","Rising turnover before the change makes the drop more impressive, which supports the argument; the rest are irrelevant."]},
{id:"ir24",sec:"IR",type:"TPA",sub:"Rates and work",d:4,kind:"tpa",

{id:"ir25",sec:"IR",type:"TPA",sub:"Successive percents",d:5,kind:"tpa",

{id:"ir26",sec:"IR",type:"TPA",sub:"Formal logic",d:4,kind:"tpa",
