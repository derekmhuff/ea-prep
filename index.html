/* ================= learn ================= */
const LES={};LESSONS.forEach((l,i)=>{l.n=i+1;LES[l.id]=l;});
function lessonMatch(l,q){return(l.match.subs||[]).includes(q.sub)||(l.match.types||[]).includes(q.type);}
function lessonsFor(q){if(q.lesson||q.sec!=="Q")return[];const a=LESSONS.filter(l=>(l.match.subs||[]).includes(q.sub)).slice(0,1),b=LESSONS.filter(l=>(l.match.types||[]).includes(q.type)).slice(0,1);return a.concat(b.filter(x=>!a.includes(x)));}
function lessonState(id){return(S.learn||{})[id]||null;}
function lessonExamStats(l){const a=S.attempts.filter(x=>Q[x.q]&&lessonMatch(l,Q[x.q])).slice(-12);return{n:a.length,c:a.filter(x=>x.ok).length};}
function nextLesson(){return LESSONS.find(l=>{const s=lessonState(l.id);return!s||s.st!=="done";})||null;}
let LS=null;
function openLesson(id){LS={id,stage:"learn",ex:0,order:[],pi:0,r:null,checked:false,hint:false,res:[],qStart:Date.now(),logFrom:Date.now()};S.learn=S.learn||{};if(!S.learn[id]){S.learn[id]={st:"started",best:0};save();}go("lesson");}
function logLearn(){if(!LS)return;const s=(Date.now()-LS.logFrom)/1000;LS.logFrom=Date.now();logSession("learn",Math.min(s,3600));save();}
function startLessonPractice(){const l=LES[LS.id];Object.assign(LS,{stage:"practice",pi:0,r:null,checked:false,hint:false,res:[],order:shuffle(l.p.map((_,i)=>i)),qStart:Date.now()});go("lesson");}

VIEWS.lesson=()=>{setMode("prep");showNav(false);const l=LES[LS.id],stages=["learn","example","practice"],si=stages.indexOf(LS.stage);
  setHeader(`<button class="hbtn" data-act="back">Learn</button>`,`<span class="tsec">Lesson ${l.n} of ${LESSONS.length}</span>`);
  let h=si>=0?`<div class="track">${stages.map((s,i)=>`<span class="${i<=si?"on":""}"></span>`).join("")}</div><p class="small">Step ${si+1} of 3: ${["The idea","Worked example","Practice"][si]}</p>`:"";
  h+=`<h1>${l.t}</h1>`;
  if(LS.stage==="learn"){
    h+=l.c.map(([hd,b])=>`<section class="sheet"><h2>${hd}</h2>${b}</section>`).join("")+`<section class="sheet"><h2>Common traps</h2><ul class="rules">${l.traps.map(t=>`<li>${t}</li>`).join("")}</ul></section>
    <div class="dock"><button class="btn primary wide" data-act="toex">See a worked example</button></div>`;
  }else if(LS.stage==="example"){const ex=l.ex,all=LS.ex>=ex.steps.length;
    h+=`<section class="sheet"><p class="slabel">Problem</p><div class="stem"><p>${ex.q}</p></div></section>${ex.steps.slice(0,LS.ex).map((s,i)=>`<div class="wstep"${i===LS.ex-1?' id="laststep"':""}><p><b>Step ${i+1}.</b> ${s[0]}</p>${s[1]?`<p class="why">${s[1]}</p>`:""}</div>`).join("")}
    ${LS.ex===0?`<p class="small">Try it on the scratchpad or paper first, then reveal the steps one at a time.</p>`:""}
    <div class="dock"><button class="btn" data-act="tolearn">Back to the idea</button>${all?`<button class="btn primary" data-act="toprac">Start practice</button>`:`<button class="btn primary" data-act="step">${LS.ex?"Show next step":"Show the first step"}</button>`}</div>`;
  }else if(LS.stage==="practice"){const q=l.p[LS.order[LS.pi]],ok=LS.checked&&isCorrect(q,LS.r);
    h+=`<div class="tbar"><span>Question ${LS.pi+1} of ${l.p.length}</span><span class="tools"><button class="tool" data-act="scratch">Scratchpad</button></span></div>
    <div class="qa" id="qa">${qaHTML(q,LS.r,{locked:LS.checked,show:LS.checked})}</div>${LS.hint&&!LS.checked?`<p class="hint"><b>Hint: </b>${q.hint}</p>`:""}${LS.checked?explainHTML(q,LS.r,ok,false):""}
    <div class="dock">${LS.checked?`<button class="btn primary wide" data-act="pnext">${LS.pi===l.p.length-1?"See results":"Next question"}</button>`:`<button class="btn" data-act="hint" ${LS.hint?"disabled":""}>Hint</button><button class="btn primary" data-act="pcheck" id="chk" ${isComplete(q,LS.r)?"":"disabled"}>Check answer</button>`}</div>`;
  }else{const c=LS.res.filter(r=>r.ok).length,n=LS.res.length,mast=c>=5,exN=BANK.filter(q=>lessonMatch(l,q)).length;
    h+=`<section class="sheet"><div class="score"><b>${c} of ${n}</b><span class="sub">${mast?"Mastered":"Not yet mastered"}</span></div><p>${mast?"You’re ready for exam-style questions on this topic.":c>=3?"Getting there. Review the questions you missed, then try the practice again.":"This one needs another pass. Reread the idea, walk through the example again, then retry."}</p></section>
    ${LS.res.some(r=>!r.ok)?`<h2>Review what you missed</h2><ul class="rlist">${LS.res.map((r,i)=>r.ok?"":`<li><button data-act="rview" data-i="${i}"><span class="mark x">✗</span><span class="t">${r.q.stem.replace(/<[^>]+>/g,"").slice(0,80)}${r.q.stem.length>80?"…":""}</span></button></li>`).join("")}</ul>`:""}
    <div class="dock">${mast&&exN?`<button class="btn" data-act="again">Practice again</button><button class="btn primary" data-act="exam">Exam-style questions</button>`:`<button class="btn" data-act="tolearn">Review the lesson</button><button class="btn primary" data-act="again">Practice again</button>`}</div>`;}
  app.innerHTML=h;
  if(LS.stage==="practice"&&!LS.checked){const q=l.p[LS.order[LS.pi]];bindQA(q,()=>LS.r,r=>{LS.r=r;$("#chk").disabled=!isComplete(q,r);});}
  ACT.back=()=>{logLearn();go("learn");};
  ACT.toex=()=>{LS.stage="example";LS.ex=0;go("lesson");};
  ACT.tolearn=()=>{LS.stage="learn";go("lesson");};
  ACT.step=()=>{LS.ex++;VIEWS.lesson();const s=$("#laststep");if(s)s.scrollIntoView({block:"center",behavior:"smooth"});};
  ACT.toprac=startLessonPractice;ACT.again=startLessonPractice;
  ACT.hint=()=>{LS.hint=true;VIEWS.lesson();};
  ACT.scratch=()=>openScratch();
  ACT.pcheck=()=>{const q=l.p[LS.order[LS.pi]],ok=isCorrect(q,LS.r);logAttempt(q,ok,(Date.now()-LS.qStart)/1000,"l");LS.res.push({q,ok,r:LS.r,h:LS.hint});LS.checked=true;save();VIEWS.lesson();const f=$("#fbk");if(f){f.scrollIntoView({block:"start",behavior:"smooth"});f.focus({preventScroll:true});}};
  ACT.pnext=()=>{if(LS.pi>=l.p.length-1){const c=LS.res.filter(r=>r.ok).length,st=S.learn[LS.id]||(S.learn[LS.id]={st:"started",best:0});st.best=Math.max(st.best||0,c);if(c>=5)st.st="done";st.last=Date.now();LS.stage="done";logLearn();go("lesson");return;}
    LS.pi++;LS.r=null;LS.checked=false;LS.hint=false;LS.qStart=Date.now();go("lesson");};
  ACT.rview=b=>{const r=LS.res[+b.dataset.i];go("qview",{q:r.q,r:r.r,back:"lesson"});};
  ACT.exam=()=>{startPrep("topic",LS.id);};
};

/* ================= calculator ================= */
let calcEl=null,CS={d:"0",acc:null,op:null,fresh:true};
function closeCalc(){if(calcEl){calcEl.remove();calcEl=null;}}
function toggleCalc(){if(calcEl){closeCalc();return;}calcEl=document.createElement("div");calcEl.className="calc";calcEl.setAttribute("role","dialog");calcEl.setAttribute("aria-label","Calculator");
  const keys=["C","±","%","÷","7","8","9","×","4","5","6","−","1","2","3","+","0",".","⌫","="];
  calcEl.innerHTML=`<div class="ch2"><span>Calculator</span><button class="hbtn" data-k="close">Close</button></div><div class="disp" id="cdisp">${CS.d}</div><div class="keys">${keys.map(k=>`<button data-k="${k}">${k}</button>`).join("")}</div>`;
  calcEl.addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(b)calcPress(b.dataset.k);});document.body.appendChild(calcEl);}
function calcFmt(x){if(!isFinite(x))return"Error";return String(+x.toPrecision(12));}
function calcRun(){const a=CS.acc,b=parseFloat(CS.d);let r=b;if(CS.op==="+")r=a+b;else if(CS.op==="−")r=a-b;else if(CS.op==="×")r=a*b;else if(CS.op==="÷")r=a/b;return r;}
function calcPress(k){if(k==="close"){closeCalc();return;}
  if(/^[0-9]$/.test(k)){CS.d=CS.fresh||CS.d==="0"?k:CS.d+k;CS.fresh=false;}
  else if(k==="."){if(CS.fresh){CS.d="0.";CS.fresh=false;}else if(!CS.d.includes("."))CS.d+=".";}
  else if(k==="C"){CS={d:"0",acc:null,op:null,fresh:true};}
  else if(k==="⌫"){if(!CS.fresh){CS.d=CS.d.length>1?CS.d.slice(0,-1):"0";}}
  else if(k==="±"){CS.d=calcFmt(-parseFloat(CS.d));}
  else if(k==="%"){CS.d=calcFmt(parseFloat(CS.d)/100);}
  else if(k==="="){if(CS.op!=null){CS.d=calcFmt(calcRun());CS.acc=null;CS.op=null;CS.fresh=true;}}
  else{if(CS.op!=null&&!CS.fresh)CS.d=calcFmt(calcRun());CS.acc=parseFloat(CS.d);CS.op=k;CS.fresh=true;}
  const d=$("#cdisp");if(d)d.textContent=CS.d;}

/* ================= scratchpad ================= */
let scratchCanvas=null;
function openScratch(){const wrap=document.createElement("div");wrap.className="scratch";wrap.setAttribute("role","dialog");wrap.setAttribute("aria-label","Scratchpad");
  wrap.innerHTML=`<div class="sbar"><span>Scratchpad</span><span class="row" style="margin:0"><button class="hbtn" data-s="clear">Clear</button><button class="hbtn" data-s="close">Close</button></span></div>`;
  document.body.appendChild(wrap);
  const dpr=window.devicePixelRatio||1,w=window.innerWidth,h=wrap.clientHeight-wrap.querySelector(".sbar").offsetHeight;
  if(!scratchCanvas||scratchCanvas.dataset.w!=String(w)){scratchCanvas=document.createElement("canvas");scratchCanvas.width=w*dpr;scratchCanvas.height=h*dpr;scratchCanvas.dataset.w=w;}
  scratchCanvas.style.height=h+"px";wrap.appendChild(scratchCanvas);
  const ctx=scratchCanvas.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineWidth=2.4;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue("--ink").trim()||"#222";
  let drawing=false;const pos=e=>{const r=scratchCanvas.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];};
  scratchCanvas.onpointerdown=e=>{drawing=true;scratchCanvas.setPointerCapture(e.pointerId);const[x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y);};
  scratchCanvas.onpointermove=e=>{if(!drawing)return;const[x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke();};
  scratchCanvas.onpointerup=scratchCanvas.onpointercancel=()=>{drawing=false;};
  wrap.addEventListener("click",e=>{const b=e.target.closest("[data-s]");if(!b)return;if(b.dataset.s==="clear")ctx.clearRect(0,0,scratchCanvas.width,scratchCanvas.height);else wrap.remove();});}

/* ================= boot ================= */
go("prep");
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
