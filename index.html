 steps:["Statement 1: 25% of 12 = 3. Yes.","Statement 2: 2 × 20% × $95,000 = $38,000, and half of the $75,000 budget is $37,500. Yes, narrowly.","Statement 3: 6 × 20% × $52,000 = $62,400, which is under $75,000. No."]},
{id:"ir29",sec:"IR",type:"MSR",sub:"Optimizing under a constraint",d:5,stim:"msr2",
 stem:"Suppose the 2 managers are hired through internal postings and the 4 analysts through recruiters. If each of the 6 coordinators is hired through either a recruiter or a referral, what is the greatest number of coordinators who could be hired through recruiters without exceeding the budget?",
 ch:["0","1","2","3","4"],a:0,
 traps:{1:"$19,000 ÷ $10,400 ≈ 1.8 suggests 1, but that forgets the coordinators hired through referrals still cost $3,000 each."},
 steps:["Analysts through recruiters: 4 × 20% × $70,000 = $56,000. Managers internally: $0. Budget left: $19,000.","Each coordinator costs $10,400 through a recruiter (20% of $52,000) or $3,000 through a referral.","With k recruiter hires: 10,400k + 3,000(6 − k) = 18,000 + 7,400k, which must be ≤ 19,000.","So k ≤ 0.13, meaning k = 0. Even all-referral hiring ($18,000) barely fits."]},
{id:"ir30",sec:"IR",type:"MSR",sub:"Inference across tabs",d:3,stim:"msr2",
 stem:"Which of the following can be inferred about the manager hires?",
 ch:["Manager hires can earn an employee a referral bonus.","A manager hired through a recruiter costs at least $19,000 in fees.","Manager roles must be filled through internal postings.","Manager hires count toward the 25% historical referral share.","Manager hires do not count against the hiring budget."],a:1,
 traps:{2:"The policy allows recruiters or internal postings. Internal postings aren’t required."},
 steps:["Recruiter fee for a manager: 20% × $95,000 = $19,000 exactly, so “at least $19,000” holds.","The policy rules out referral bonuses for managers (A and D) and allows recruiters (C).","Nothing exempts managers from the budget (E)."]},
/* ---------- Verbal, set 2 ---------- */
{id:"v18",sec:"V",type:"SC",sub:"Subject–verb agreement",d:2,
 stem:"Each of the new regional offices <u>have their own budget</u> for travel and training.",
 ch:["have their own budget","has its own budget","has their own budget","have its own budget","are having their own budget"],a:1,
 traps:{2:"“Has” is right, but “their” is plural and doesn’t match the singular “Each.”"},
 steps:["The subject is “Each,” which is singular. “Of the new regional offices” only describes it.","A singular subject needs “has,” and the pronoun must match: “its own budget.”","B is the only choice that fixes both the verb and the pronoun."]},
{id:"v19",sec:"V",type:"SC",sub:"Modifiers",d:4,
 stem:"The board approved the new headquarters lease last week, <u>which will save</u> the company about $2 million a year.",
 ch:["which will save","a decision that will save","and it will save","which is saving","that will save"],a:1,
 traps:{0:"“Which” after a comma points at the nearest noun, “week,” not at the whole idea of approving the lease."},
 steps:["A comma followed by “which” modifies the noun just before it, here “week.” The week won’t save money.","Fix it with a noun that sums up the action, then a modifier: “a decision that will save.”","C’s “it” is ambiguous (the lease? the board?), D repeats the error, and E’s “that” can’t follow a comma this way."]},
{id:"v20",sec:"V",type:"SC",sub:"Comparisons",d:3,
 stem:"The analysts found that the cost of leasing the equipment was lower than <u>buying it</u>.",
 ch:["buying it","the cost of buying it","to buy it","it was to buy it","buying it would cost"],a:1,
 traps:{0:"This compares the cost of leasing with the act of buying. A cost can’t be lower than an action."},
 steps:["What’s being compared? “The cost of leasing,” so the other side must also be a cost.","A, C, and D compare a cost with an action; E is ungrammatical.","B compares cost with cost."]},
{id:"v21",sec:"V",type:"SC",sub:"Idioms",d:3,
 stem:"The committee regards the proposal <u>to be</u> a reasonable compromise between the two plans.",
 ch:["to be","as","as being","like","that it is"],a:1,
 traps:{0:"“Regard … to be” isn’t idiomatic. “Consider X to be Y” is fine, but that’s a different verb.",2:"“As being” adds a word that does nothing. The test prefers the concise idiom."},
 steps:["“Regard” takes a fixed partner: “regard X as Y.”","C is wordy, and D and E aren’t idiomatic with “regard.”","B is the correct, concise idiom."]},
{id:"v22",sec:"V",type:"SC",sub:"Verb mood",d:4,
 stem:"The auditor recommended that the company <u>restates</u> its earnings for the past two quarters.",
 ch:["restates","restate","would restate","is to restate","restated"],a:1,
 traps:{0:"It sounds natural in everyday speech, but after “recommended that,” the verb takes its base form."},
 steps:["Verbs like recommend, require, insist, and request trigger the command subjunctive.","The subjunctive uses the base form, with no -s: “that the company restate.”","Only B uses the base form."]},
{id:"v23",sec:"V",type:"SC",sub:"Modifiers",d:3,
 stem:"Founded in 1998, <u>the company’s growth has been driven by acquisitions</u> in Europe and Asia.",
 ch:["the company’s growth has been driven by acquisitions","the company has grown mainly through acquisitions","growth at the company has been driven by acquisitions","the company, whose growth has been driven by acquisitions","acquisitions have driven the company’s growth"],a:1,
 traps:{0:"The possessive makes “growth” the subject, and growth wasn’t founded in 1998."},
 steps:["“Founded in 1998” describes the company, so “the company” must come right after the comma.","A, C, and E put “growth” or “acquisitions” in that spot.","D starts correctly but never gives “the company” a main verb, so it’s a fragment. B is complete and clear."]},
{id:"v24",sec:"V",type:"SC",sub:"Parallelism",d:3,
 stem:"The new policy is intended <u>not only to reduce costs but also improving</u> customer response times.",
 ch:["not only to reduce costs but also improving","not only to reduce costs but also to improve","to not only reduce costs but improving also","not only reducing costs but also to improve","not only to reduce costs, but improving also"],a:1,
 steps:["“Not only X but also Y” requires X and Y to have the same form.","X is “to reduce,” so Y must be “to improve.”","Only B matches both halves."]},
{id:"v25",sec:"V",type:"SC",sub:"Logic and connectors",d:5,
 stem:"<u>Although sales rose 8% last year, the company’s market share declined because</u> competitors grew even faster.",
 ch:["Although sales rose 8% last year, the company’s market share declined because","Although sales rose 8% last year, the company’s market share declined, being that","Sales rose 8% last year, but because the company’s market share declined,","Despite sales rising 8% last year, the company’s market share declined due to","Although sales rose 8% last year, and the company’s market share declined because"],a:0,
 traps:{3:"“Due to” needs a noun after it (“due to stronger competition”), not a full clause like “competitors grew even faster.”"},
 steps:["The original is sometimes right. Judge it on its merits before hunting for a change.","A has a clear contrast (“Although … declined”) and a clear cause (“because competitors grew”).","B uses “being that,” which isn’t standard. C reverses the logic. D’s “due to” can’t introduce a clause. E’s “and” leaves the “Although” clause with no main clause."]},
{id:"v26",sec:"V",type:"SC",sub:"Quantity words",d:3,
 stem:"This year the firm received <u>less applications than last year, but their quality was</u> noticeably higher.",
 ch:["less applications than last year, but their quality was","fewer applications than last year, but their quality was","fewer applications than last year, but the applications’ quality were","less applications than last year, but its quality was","fewer applications than it had last year, but their quality were"],a:1,
 steps:["Applications can be counted, so the word is “fewer,” not “less.” That removes A and D.","“Quality” is singular, so the verb is “was,” not “were.” That removes C and E.","B is left."]},
{id:"v27",sec:"V",type:"CR",sub:"Evaluate a plan",d:3,
 stem:"To cut overtime costs, a warehouse plans to switch from two 10-hour shifts a day to three 8-hour shifts, hiring six more workers. Management expects total labor costs to fall. Which of the following, if true, casts the most doubt on management’s expectation?",
 ch:["Most overtime currently occurs in the last two hours of each 10-hour shift.","Overtime is paid at 1.5 times the regular hourly rate.","The benefits for each additional worker cost more per year than the overtime premium the change would eliminate.","Most current workers prefer 8-hour shifts.","Several competing warehouses use three 8-hour shifts."],a:2,
 traps:{1:"A higher overtime rate makes eliminating overtime more valuable, which supports the plan."},
 steps:["The plan trades overtime costs for the cost of six new workers.","It saves money only if the eliminated overtime exceeds what the new workers cost.","If benefits alone for the new workers outweigh the overtime saved, total costs could rise. A and B, if anything, support the plan."]},
{id:"v28",sec:"V",type:"CR",sub:"Assumption",d:4,
 stem:"In a city survey, 70% of residents who responded said they support a proposed transit tax. Therefore, the tax measure will pass in next month’s election, which requires a simple majority. The argument assumes which of the following?",
 ch:["Most residents use public transit at least once a week.","Revenue from the tax will be spent on transit improvements.","A similar measure failed in a previous election.","Survey respondents’ views reflect those of the people who will vote next month.","At least 70% of voters must support a measure for it to pass."],a:3,
 traps:{4:"The measure needs a simple majority, not 70%. This contradicts the argument rather than supporting it."},
 steps:["Evidence: 70% of survey respondents support the tax. Conclusion: a majority of voters will.","The gap: respondents and voters may be different groups of people.","Negate D: if respondents don’t reflect voters, the 70% says little about the election, and the argument fails."]},
{id:"v29",sec:"V",type:"CR",sub:"Strengthen",d:3,
 stem:"Researchers found that office workers with more natural light at their desks took fewer sick days than those with less. They concluded that natural light improves workers’ health. Which of the following, if true, most strengthens the conclusion?",
 ch:["Offices with more natural light tend to be in newer buildings with better ventilation.","When a company added windows to half of its offices, sick days fell in the renovated offices but not in the others.","Most workers say they prefer desks near windows.","Natural light reduces a building’s electricity costs.","Sick days vary by season."],a:1,
 traps:{0:"Better ventilation is an alternative cause. This weakens the conclusion."},
 steps:["The evidence is a correlation: more light, fewer sick days.","The best support isolates the cause: change only the light and see whether health changes.","B does that. Adding windows to half the offices reduced sick days only where light increased."]},
{id:"v30",sec:"V",type:"CR",sub:"Evaluate",d:4,
 stem:"Our main competitor cut its prices by 15%, and its sales volume rose by 25%. If we cut our prices by 15%, our revenue will also rise. Which of the following would be most useful to know in evaluating this argument?",
 ch:["Whether the competitor’s profits rose after its price cut","How long the competitor kept its lower prices","Whether our customers respond to price changes as strongly as the competitor’s customers did","How many competitors operate in the market","When the competitor was founded"],a:2,
 traps:{0:"The argument is about revenue, not profit."},
 steps:["The competitor’s revenue rose because volume grew enough: 0.85 × 1.25 ≈ 1.06.","Our revenue rises only if our volume grows more than about 18% (1 ÷ 0.85 ≈ 1.18).","So the key unknown is whether our customers are as price-sensitive. C targets exactly that."]},
{id:"v31",sec:"V",type:"CR",sub:"Inference",d:5,
 stem:"In 2025, Hospital H performed more knee surgeries than it did in 2024, but knee surgeries made up a smaller share of all the surgeries it performed. If these statements are true, which of the following must also be true?",
 ch:["Knee surgeries at Hospital H rose by less than 10%.","Most surgeries at Hospital H are not knee surgeries.","Hospital H hired additional surgeons in 2025.","Hospital H performed more surgeries other than knee surgeries in 2025 than in 2024.","Knee surgeries rose by a larger percentage than total surgeries did."],a:3,
 traps:{4:"This is backward. If knee surgeries’ share fell, total surgeries grew by a larger percentage."},
 steps:["Knee surgeries rose but their share fell, so total surgeries grew faster than knee surgeries.","Total = knee + other. For the total to outgrow a rising knee count, the other surgeries must have risen too, and by a larger percentage.","So D must be true. A, B, and C may or may not be true."]},
{id:"v32",sec:"V",type:"CR",sub:"Explain a discrepancy",d:4,
 stem:"The number of flights at Airport A rose 20% last year, yet the average delay per flight there fell. Which of the following, if true, most helps explain this?",
 ch:["The number of passengers at Airport A also rose.","Airport A opened a new runway early last year that substantially increased the number of takeoffs it could handle per hour.","Delays at nearby airports increased last year.","Airlines at Airport A switched to larger planes.","Most flight delays are caused by weather."],a:1,
 traps:{3:"Larger planes change passenger numbers, not the number of flights competing for runways."},
 steps:["The surprise: more flights should mean more congestion and longer delays.","A good answer shows capacity growing faster than traffic.","A new runway that raised takeoff capacity does exactly that."]},
{id:"v33",sec:"V",type:"RC",sub:"Function",d:3,stim:"rc2",
 stem:"The second paragraph primarily serves to",
 ch:["explain why the anchoring effect occurs","present evidence that challenges a view about business buyers and suggest a refinement of it","argue that procurement rules should be abolished","show that business buyers behave exactly like consumers","describe how software firms design their price tiers"],a:1,
 traps:{3:"Business buyers were affected, but the effect shrank under formal review, so they don’t behave “exactly” like consumers."},
 steps:["Paragraph 2 opens with a view: anchoring is weaker for business buyers.","It then gives a study that “complicates that view,” followed by a refined explanation: process, not buyer type.","B describes that structure. The explanation of anchoring itself (A) is in paragraph 1."]},
{id:"v34",sec:"V",type:"RC",sub:"Application",d:4,stim:"rc2",
 stem:"Based on the passage, the anchoring effect would most likely be weakest for which of the following purchases?",
 ch:["A small software purchase made by a manager at a large firm","A consumer buying a streaming subscription","A large purchase that must pass a formal procurement review","A purchase made from a price sheet with three tiers","A purchase made by a mid-sized firm below the review threshold"],a:2,
 steps:["The study found the effect “shrank sharply” for purchases above the threshold that triggers formal review.","So the effect should be weakest where formal review applies.","C matches. A and E fall below the threshold, and B is a consumer purchase, where anchoring is described as strong."]},
{id:"v35",sec:"V",type:"RC",sub:"Weaken",d:5,stim:"rc2",
 stem:"Which of the following, if true, would most weaken the suggestion made in the passage’s final sentence?",
 ch:["Most of the firms studied used the same procurement software.","At firms with no formal procurement review, large purchases showed the same sharp drop in the anchoring effect.","Consumers are also influenced by three-tier price sheets.","The middle tier was the most profitable tier for the software firms.","Some buyers in the study had never purchased software before."],a:1,
 steps:["The suggestion: the formal review process, not the type of buyer, is what limits anchoring.","An alternative explanation: purchase size limits anchoring, and review simply happens to apply to large purchases.","B shows the same drop for large purchases even without review, pointing to size rather than process."]},
/* ---------- Quant, set 2 ---------- */
{id:"q19",sec:"Q",type:"PS",sub:"Percents",d:2,
 stem:"A store’s sales were $40,000 in March and $46,000 in April. By what percent did sales increase from March to April?",
 ch:["6%","13%","15%","46%","115%"],a:2,
 traps:{1:"6,000 ÷ 46,000 ≈ 13% uses April as the base. Percent change always divides by the starting value."},
 steps:["Change: 46,000 − 40,000 = 6,000.","Divide by the starting value: 6,000 ÷ 40,000 = 0.15.","Sales rose 15%."]},
{id:"q20",sec:"Q",type:"PS",sub:"Compound interest",d:3,
 stem:"An investment of $5,000 earns 4% interest, compounded annually. What is the investment worth after 2 years?",
 ch:["$5,200","$5,400","$5,408","$5,416","$5,800"],a:2,
 traps:{1:"$5,400 is simple interest. Compounding also earns interest on the first year’s interest."},
 steps:["Year 1: 5,000 × 1.04 = 5,200.","Year 2: 5,200 × 1.04 = 5,408.","The extra $8 over simple interest is 4% of the first year’s $200 of interest."]},
{id:"q21",sec:"Q",type:"PS",sub:"Rates and work",d:4,
 stem:"A driver travels 120 miles to a client site at 40 miles per hour and returns along the same route at 60 miles per hour. What is the average speed for the round trip, in miles per hour?",
 ch:["45","48","50","52","55"],a:1,
 traps:{2:"Averaging 40 and 60 ignores that the driver spends more time at the slower speed."},
 steps:["Average speed = total distance ÷ total time.","Out: 120 ÷ 40 = 3 hours. Back: 120 ÷ 60 = 2 hours.","240 miles in 5 hours = 48 mph."]},
{id:"q22",sec:"Q",type:"PS",sub:"Algebra",d:3,
 stem:"If x² − 5x − 14 = 0 and x > 0, what is the value of 2x − 3?",
 ch:["−7","1","9","11","17"],a:3,
 traps:{0:"−7 comes from the root x = −2, which the condition x > 0 rules out."},
 steps:["Factor: (x − 7)(x + 2) = 0, so x = 7 or x = −2.","x > 0, so x = 7.","2(7) − 3 = 11."]},
{id:"q23",sec:"Q",type:"PS",sub:"Statistics",d:4,
 stem:"Set A is {4, 8, 12, 16, 20}. Each number in A is increased by 5, and then each result is multiplied by 2. What is the range of the new set?",
 ch:["16","21","26","32","42"],a:3,
 traps:{4:"Adding 5 to every number shifts the whole set without changing the range. Only the doubling matters."},
 steps:["Original range: 20 − 4 = 16.","Adding the same amount to every value leaves the range unchanged.","Multiplying every value by 2 doubles the range: 32."]},
{id:"q24",sec:"Q",type:"PS",sub:"Exponents",d:4,
 stem:"If 2<sup>x</sup> × 4<sup>x + 1</sup> = 128<sup>2</sup>, what is the value of x?",
 ch:["3","4","5","6","7"],a:1,
 steps:["Rewrite everything as powers of 2: 4 = 2<sup>2</sup> and 128 = 2<sup>7</sup>.","Left side: 2<sup>x</sup> × 2<sup>2x + 2</sup> = 2<sup>3x + 2</sup>. Right side: (2<sup>7</sup>)<sup>2</sup> = 2<sup>14</sup>.","3x + 2 = 14, so x = 4."]},
{id:"q25",sec:"Q",type:"PS",sub:"Rates and work",d:3,
 stem:"Pipe A can fill an empty tank in 4 hours, and pipe B can drain a full tank in 6 hours. If the tank starts empty and both pipes are open, how many hours will it take to fill the tank?",
 ch:["2.4","5","10","12","24"],a:3,
 traps:{0:"2.4 hours adds the two rates, but pipe B drains, so its rate is subtracted."},
 steps:["A fills 1/4 of the tank per hour; B drains 1/6 per hour.","Net rate: 1/4 − 1/6 = 3/12 − 2/12 = 1/12 per hour.","Time: 12 hours."]},
{id:"q26",sec:"Q",type:"PS",sub:"Counting",d:5,
 stem:"How many positive integers less than 100 are divisible by 3 or by 5, but not by both?",
 ch:["34","40","46","52","58"],a:1,
 traps:{2:"46 counts every number divisible by 3 or 5, including those divisible by both. The question excludes that overlap."},
 steps:["Divisible by 3: 99 ÷ 3 = 33 numbers. Divisible by 5: 95 ÷ 5 = 19 numbers.","Divisible by both, meaning by 15: 90 ÷ 15 = 6 numbers.","3 or 5 but not both: 33 + 19 − 2 × 6 = 40. The overlap is removed from each group, so it’s subtracted twice."]},
{id:"q27",sec:"Q",type:"DS",sub:"Number properties",d:2,stem:"Is the integer n divisible by 6?",s1:"n is divisible by 12.",s2:"n is divisible by 3.",a:0,
 traps:{3:"Statement (2) isn’t enough: 9 is divisible by 3 but not by 6."},
 steps:["(1): every multiple of 12 is a multiple of 6. Definite yes: sufficient.","(2): n could be 6 (yes) or 9 (no). Not sufficient.","Answer A."]},
{id:"q28",sec:"Q",type:"DS",sub:"Word problems",d:3,stem:"What is the price of one notebook?",s1:"Three notebooks and two pens cost $13 in total.",s2:"One pen costs $2.",a:2,
 steps:["(1): 3n + 2p = 13 has many solutions. Not sufficient.","(2): gives the pen price but says nothing about notebooks. Not sufficient.","Together: 3n + 4 = 13, so n = 3. Sufficient together: C."]},
{id:"q29",sec:"Q",type:"DS",sub:"Inequalities",d:4,stem:"Is x > 0?",s1:"x³ > 0",s2:"x + |x| > 0",a:3,
 traps:{0:"Statement (2) works too: for any x ≤ 0, x + |x| equals 0."},
 steps:["(1): a cube keeps the sign of x, so x³ > 0 means x > 0. Sufficient.","(2): if x ≤ 0, then |x| = −x and x + |x| = 0, which isn’t greater than 0. So x must be positive. Sufficient.","Each statement alone works: D."]},
{id:"q30",sec:"Q",type:"DS",sub:"Word problems",d:4,stem:"Machines A and B together produce 300 units per hour. How many units per hour does machine A produce?",s1:"Machine A produces more units per hour than machine B.",s2:"Machine B produces at least 120 units per hour.",a:4,
 traps:{2:"Together the statements narrow A to more than 150 and at most 180. That’s still a range, not one value."},
 steps:["(1): A is more than 150, but could be 160, 200, or other values. Not sufficient.","(2): A is at most 180. Not sufficient.","Together: A is above 150 and at most 180, still many possible values. E."]},
{id:"q31",sec:"Q",type:"DS",sub:"Remainders",d:4,stem:"If n is an integer, what is the remainder when n² is divided by 4?",s1:"n is divisible by 3.",s2:"n is odd.",a:1,
 steps:["(1): n = 3 gives 9, remainder 1; n = 6 gives 36, remainder 0. Not sufficient.","(2): an odd n is 2k + 1, so n² = 4k² + 4k + 1, which always leaves remainder 1. Sufficient.","Answer B."]},
{id:"q32",sec:"Q",type:"DS",sub:"Percents",d:5,stem:"Did Company R’s profit increase from 2024 to 2025? (Profit equals revenue minus costs.)",s1:"Revenue rose 10% from 2024 to 2025.",s2:"Costs fell from 80% of revenue in 2024 to 75% of revenue in 2025.",a:2,
 traps:{1:"A higher margin on much smaller revenue can mean less profit. You need the revenue change too."},
 steps:["(1): revenue rose, but costs are unknown. Not sufficient.","(2): the margin rose from 20% to 25%, but if revenue fell sharply, profit could still drop. Not sufficient.","Together: profit went from 0.20R to 0.25 × 1.1R = 0.275R. Definite yes: C."]}
);
CONCEPTS.push(
 {id:"c24",topic:"Sentence Correction",front:"“…approved the lease last week, which will save money.” What does “which” refer to?",back:"The nearest noun, “week.” To refer to the whole action, use a summary noun: “…last week, a decision that will save money.”"},
 {id:"c25",topic:"Sentence Correction",front:"“The auditor recommended that the company ___ its earnings.” Restate or restates?",back:"Restate. Recommend, require, insist, and request take the base form of the verb (the subjunctive)."},
 {id:"c26",topic:"Integrated Reasoning",front:"Two groups are 58% and 41% of a population. Smallest and largest possible overlap?",back:"Smallest: 58 + 41 − 100 = −1, so 0%. Largest: the smaller group, 41%."},
 {id:"c27",topic:"Quant",front:"Out at 40 mph, back the same distance at 60 mph. Average speed?",back:"48 mph, not 50. Average speed = total distance ÷ total time, and you spend longer at the slower speed."}
);

const LESSONS=[
{id:"L01",t:"Fractions, decimals, and percents",blurb:"The conversions behind every percent and ratio question.",match:{subs:[]},
 c:[["Percent means “per hundred”","<p>35% = 35/100 = 0.35. To turn a percent into a decimal, move the decimal point two places left. To go the other way, move it two places right.</p>"],
  ["Fractions worth memorizing","<p>1/2 = 50%, 1/4 = 25%, 3/4 = 75%, 1/5 = 20%, 1/10 = 10%, 1/8 = 12.5%, 1/3 ≈ 33.3%, 2/3 ≈ 66.7%.</p><p>Knowing these by heart makes mental math fast, which matters because Quant has no calculator.</p>"],
  ["Finding a percent of a number","<p>“Of” means multiply: 35% of 2,400 = 0.35 × 2,400 = 840.</p><p>Mental shortcut: 10% of 2,400 is 240, so 30% is 720 and 5% is 120. Add them: 840.</p>"],
  ["What percent is A of B?","<p>Divide the part by the whole: 18 out of 120 is 18 ÷ 120 = 0.15 = 15%. Simplify the fraction first if you can: 18/120 = 3/20 = 15/100.</p>"]],
 ex:{q:"A team closed 45 of its 60 open deals. What percent did it close?",steps:[["Write it as a fraction: 45/60.","Part over whole."],["Simplify: divide top and bottom by 15 to get 3/4.","Smaller numbers are easier to convert."],["3/4 = 75%.","It’s one of the fractions worth memorizing."]]},
 traps:["Dividing the wrong way round. In “what percent is A of B,” the whole (B) goes on the bottom.","Mixing up 0.35 and 0.35%. 0.35 is 35%; 0.35% is 0.0035."],
 p:[
 {id:"L01a",stem:"What is 20% of 350?",ch:["35","50","70","175","280"],a:2,hint:"20% is the same as 1/5. What is 350 ÷ 5?",traps:{0:"35 is 10% of 350. Double it for 20%."},steps:["20% = 1/5.","350 ÷ 5 = 70."]},
 {id:"L01b",stem:"Which of the following equals 3/8?",ch:["0.38","0.375","3.8%","38%","0.0375"],a:1,hint:"1/8 = 0.125. Multiply that by 3.",traps:{0:"3/8 isn’t “3 point 8.” It means 3 divided by 8."},steps:["1/8 = 0.125.","3 × 0.125 = 0.375, which is 37.5%."]},
 {id:"L01c",stem:"In a survey, 18 of 120 responses were negative. What percent were negative?",ch:["6.7%","12%","15%","18%","20%"],a:2,hint:"Part ÷ whole: 18 ÷ 120. Simplify the fraction first.",traps:{3:"18 is the count, not the percent. Divide by the total of 120."},steps:["Fraction: 18/120.","Divide top and bottom by 6: 3/20.","3/20 = 15/100 = 15%."]},
 {id:"L01d",stem:"What is 15% of 260?",ch:["26","36","39","45","52"],a:2,hint:"Find 10%, then half of that for 5%, and add them.",steps:["10% of 260 = 26.","5% is half of that: 13.","15% = 26 + 13 = 39."]},
 {id:"L01e",stem:"Which of the following is largest?",ch:["2/3","0.65","5/8","64%","0.6"],a:0,hint:"Turn everything into a decimal, then compare.",steps:["2/3 ≈ 0.667, 5/8 = 0.625, 64% = 0.64.","Order: 0.667 > 0.65 > 0.64 > 0.625 > 0.6."]},
 {id:"L01f",stem:"A $4,000 budget is split so that 3/5 goes to marketing. How much goes to marketing?",ch:["$800","$1,600","$2,000","$2,400","$3,000"],a:3,hint:"Find 1/5 of $4,000 first, then multiply by 3.",traps:{1:"$1,600 is the other 2/5, the part that doesn’t go to marketing."},steps:["1/5 of 4,000 = 800.","3/5 = 3 × 800 = 2,400."]}]},
{id:"L02",t:"Percent change",blurb:"Increases, decreases, and why percents don’t cancel.",match:{subs:["Percents","Compound interest"]},
 c:[["The formula","<p>Percent change = (new − old) ÷ old × 100. The base is always the starting value.</p>"],
  ["Think in multipliers","<p>A 20% increase means × 1.20. A 20% decrease means × 0.80. Most percent problems become a single multiplication.</p>"],
  ["Successive changes multiply","<p>+20% then −20% is 1.2 × 0.8 = 0.96: a 4% loss overall. Never add or cancel percents; the second change applies to a different number.</p>"],
  ["Working backward","<p>If a price after a 25% increase is $150, the original is 150 ÷ 1.25 = $120. Subtracting 25% of $150 gives the wrong answer.</p>"]],
 ex:{q:"Sales went from $80,000 to $92,000. What was the percent increase?",steps:[["Change: 92,000 − 80,000 = 12,000.","Always new minus old."],["Divide by the starting value: 12,000 ÷ 80,000 = 0.15.","The base is the old value, not the new one."],["0.15 = 15%.",""]]},
 traps:["Dividing by the new value instead of the old one.","Undoing a percent increase by subtracting the same percent."],
 p:[
 {id:"L02a",stem:"A price rises from $50 to $60. What is the percent increase?",ch:["10%","16.7%","20%","60%","120%"],a:2,hint:"Change ÷ starting price.",traps:{1:"16.7% divides by the new price, $60. Use the starting price."},steps:["Change: 60 − 50 = 10.","10 ÷ 50 = 0.2 = 20%."]},
 {id:"L02b",stem:"What number is 30% more than 200?",ch:["230","260","270","300","600"],a:1,hint:"Use the multiplier 1.30.",steps:["30% more means × 1.3.","200 × 1.3 = 260."]},
 {id:"L02c",stem:"A stock falls from $40 to $30. What is the percent decrease?",ch:["10%","25%","33.3%","75%","133%"],a:1,hint:"The change is 10. Divide by the starting value.",traps:{2:"33.3% divides by $30, the new value."},steps:["Change: 40 − 30 = 10.","10 ÷ 40 = 0.25 = 25%."]},
 {id:"L02d",stem:"A $60,000 salary gets a 10% raise one year and another 10% raise the next. What is the new salary?",ch:["$66,000","$72,000","$72,600","$73,200","$78,000"],a:2,hint:"Multiply by 1.1, then by 1.1 again.",traps:{1:"$72,000 adds 20%, but the second raise applies to the new, higher salary."},steps:["Year 1: 60,000 × 1.1 = 66,000.","Year 2: 66,000 × 1.1 = 72,600."]},
 {id:"L02e",stem:"After a 25% discount, a jacket costs $90. What was the original price?",ch:["$67.50","$112.50","$115","$120","$125"],a:3,hint:"After the discount you pay 75% of the original: 0.75 × original = 90.",traps:{1:"$112.50 adds 25% to $90, but the discount was 25% of the original price, not the sale price."},steps:["You paid 75%: 0.75 × P = 90.","P = 90 ÷ 0.75 = 120.","Check: 25% of 120 is 30, and 120 − 30 = 90."]},
 {id:"L02f",stem:"A price increases by 50% and then decreases by 50%. The final price is what percent of the original?",ch:["50%","75%","100%","125%","150%"],a:1,hint:"Multiply the two multipliers: 1.5 × 0.5.",traps:{2:"The changes don’t cancel. The 50% decrease applies to a bigger number."},steps:["1.5 × 0.5 = 0.75.","The final price is 75% of the original."]}]},
{id:"L03",t:"Ratios and mixtures",blurb:"Splitting totals into parts and tracking ingredients.",match:{subs:["Ratios","Mixtures"]},
 c:[["What a ratio says","<p>3:5 means for every 3 of one thing there are 5 of the other. It describes proportions, not actual counts.</p>"],
  ["The parts method","<p>Treat a ratio as parts. 3:5 has 3 + 5 = 8 parts. If the total is 40, each part is 5, so the groups are 15 and 25.</p>"],
  ["The multiplier k","<p>Write the groups as 3k and 5k. This helps when something changes, like new people joining one group.</p>"],
  ["Mixtures","<p>Track the amount of the ingredient, not just the percentage. A 40-liter mix that’s 25% concentrate holds 10 liters of concentrate.</p>"]],
 ex:{q:"Managers and analysts are in a ratio of 2:7, with 54 people in total. How many analysts are there?",steps:[["Add the parts: 2 + 7 = 9.","The total is made of 9 equal parts."],["One part: 54 ÷ 9 = 6 people.",""],["Analysts: 7 parts × 6 = 42.","Check: 12 managers + 42 analysts = 54."]]},
 traps:["Treating the ratio numbers as actual counts.","Forgetting to add the parts to find how many parts make the total."],
 p:[
 {id:"L03a",stem:"Red and blue marbles are in a ratio of 2:3, with 30 marbles in total. How many are blue?",ch:["6","10","12","18","20"],a:3,hint:"There are 5 parts. How many marbles is one part?",traps:{2:"12 is the number of red marbles. Check which group the question asks for."},steps:["2 + 3 = 5 parts.","30 ÷ 5 = 6 per part.","Blue: 3 × 6 = 18."]},
 {id:"L03b",stem:"A recipe uses flour and sugar in a ratio of 5:2. With 15 cups of flour, how many cups of sugar are needed?",ch:["3","6","7.5","10","37.5"],a:1,hint:"Flour went from 5 to 15. What did it get multiplied by?",steps:["5 × 3 = 15, so everything scales by 3.","Sugar: 2 × 3 = 6."]},
 {id:"L03c",stem:"Two partners split a $50,000 profit in a ratio of 3:7. How much is the smaller share?",ch:["$7,500","$15,000","$16,667","$21,429","$35,000"],a:1,hint:"There are 10 parts in total.",steps:["3 + 7 = 10 parts.","50,000 ÷ 10 = 5,000 per part.","Smaller share: 3 × 5,000 = 15,000."]},
 {id:"L03d",stem:"Two numbers are in a ratio of 4:5 and differ by 6. What is the larger number?",ch:["20","24","25","30","54"],a:3,hint:"Write them as 4k and 5k. Their difference is k.",steps:["The numbers are 4k and 5k.","5k − 4k = k = 6.","Larger: 5 × 6 = 30."]},
 {id:"L03e",stem:"A 20-liter mix is 30% juice. How many liters of juice does it contain?",ch:["3","6","10","14","20"],a:1,hint:"Find 30% of 20.",steps:["0.3 × 20 = 6 liters."]},
 {id:"L03f",stem:"A team has 6 managers and 9 analysts. How many analysts must be hired for the ratio of managers to analysts to become 1:2?",ch:["1","2","3","4","6"],a:2,hint:"With 6 managers, how many analysts does a 1:2 ratio need?",steps:["1:2 with 6 managers means 12 analysts.","12 − 9 = 3 more analysts."]}]},
{id:"L04",t:"Averages, medians, and ranges",blurb:"Why sums are the key to every average problem.",match:{subs:["Averages","Statistics"]},
 c:[["Average = sum ÷ count","<p>The fastest move is to flip it: sum = average × count. Most average problems are sum problems in disguise.</p>"],
  ["Adding or removing a value","<p>Compare the sums before and after. If five numbers average 18 (sum 90) and four of them average 16 (sum 64), the removed number is 26.</p>"],
  ["Weighted averages","<p>When groups differ in size, weight each by its size: total of everything ÷ total count. The answer leans toward the bigger group.</p>"],
  ["Median and range","<p>The median is the middle value once the list is sorted (with an even count, average the middle two). The range is largest minus smallest.</p>"]],
 ex:{q:"Four exam scores average 80. What score on a fifth exam would raise the average to 82?",steps:[["Sum of four: 4 × 80 = 320.","Turn the average into a sum."],["Needed sum of five: 5 × 82 = 410.",""],["Fifth score: 410 − 320 = 90.","Check: 410 ÷ 5 = 82."]]},
 traps:["Averaging two averages without weighting by group size.","Finding a median without sorting the list first."],
 p:[
 {id:"L04a",stem:"What is the average of 12, 15, 18, and 23?",ch:["15","16","17","17.5","18"],a:2,hint:"Add them, then divide by 4.",steps:["Sum: 12 + 15 + 18 + 23 = 68.","68 ÷ 4 = 17."]},
 {id:"L04b",stem:"What is the median of 9, 3, 12, 7, 5?",ch:["5","7","7.2","9","12"],a:1,hint:"Sort the list first.",traps:{4:"12 is the middle of the list as written. Sort it first."},steps:["Sorted: 3, 5, 7, 9, 12.","The middle (third) value is 7."]},
 {id:"L04c",stem:"The average of 6 numbers is 10. What is their sum?",ch:["16","36","50","60","66"],a:3,hint:"Sum = average × count.",steps:["6 × 10 = 60."]},
 {id:"L04d",stem:"Three numbers average 20. Two of them are 15 and 22. What is the third?",ch:["17","20","21","23","25"],a:3,hint:"What must all three add up to?",steps:["Total: 3 × 20 = 60.","60 − 15 − 22 = 23."]},
 {id:"L04e",stem:"Team A has 10 people who averaged 30 hours of training. Team B has 30 people who averaged 50 hours. What is the average for all 40 people?",ch:["35","40","42.5","45","47.5"],a:3,hint:"Find each team’s total hours, then divide by 40.",traps:{1:"40 is the simple average of 30 and 50, but team B is three times bigger, so the answer leans toward 50."},steps:["Team A: 10 × 30 = 300 hours. Team B: 30 × 50 = 1,500 hours.","1,800 ÷ 40 = 45."]},
 {id:"L04f",stem:"What is the range of 14, 3, 27, 9, 18?",ch:["9","14","18","24","27"],a:3,hint:"Largest minus smallest.",steps:["27 − 3 = 24."]}]},
{id:"L05",t:"Solving equations",blurb:"Getting x alone, including when x is squared.",match:{subs:["Algebra"]},
 c:[["Keep it balanced","<p>Whatever you do to one side, do to the other. The goal is to get x by itself.</p>"],
  ["Undo in reverse order","<p>In 3x + 5 = 20, the x was multiplied by 3 and then had 5 added. Undo the last step first: subtract 5 (3x = 15), then divide by 3 (x = 5).</p>"],
  ["Distribute, then combine","<p>2(x − 4) + x = 13 becomes 2x − 8 + x = 13, then 3x − 8 = 13, so x = 7. The 2 multiplies everything inside the parentheses.</p>"],
  ["When x is squared","<p>Move everything to one side and factor. For x² − 5x + 6 = 0, find two numbers that multiply to 6 and add to 5: 2 and 3. So (x − 2)(x − 3) = 0, and x = 2 or x = 3. Then check any condition like x > 0.</p>"]],
 ex:{q:"Solve 4x − 7 = 2x + 9.",steps:[["Subtract 2x from both sides: 2x − 7 = 9.","Gather the x terms on one side."],["Add 7 to both sides: 2x = 16.",""],["Divide by 2: x = 8.","Check: 4(8) − 7 = 25 and 2(8) + 9 = 25."]]},
 traps:["Sign errors when moving a term across the equals sign.","Distributing to only the first term in the parentheses."],
 p:[
 {id:"L05a",stem:"If 3x + 5 = 20, what is x?",ch:["3","5","6","8.3","15"],a:1,hint:"Subtract 5 from both sides, then divide by 3.",steps:["3x = 15.","x = 5."]},
 {id:"L05b",stem:"If x/4 − 2 = 3, what is x?",ch:["1.25","4","5","12","20"],a:4,hint:"Add 2 to both sides, then multiply by 4.",traps:{2:"5 is x/4. Multiply by 4 to finish."},steps:["x/4 = 5.","x = 20."]},
 {id:"L05c",stem:"If 2(x − 4) + x = 13, what is x?",ch:["3","5","7","8","9"],a:2,hint:"Distribute the 2 to both x and −4.",steps:["2x − 8 + x = 13.","3x − 8 = 13, so 3x = 21.","x = 7."]},
 {id:"L05d",stem:"If 5x − 3 = 2x + 12, what is x?",ch:["−5","3","5","9","15"],a:2,hint:"Get the x terms on one side and the numbers on the other.",steps:["Subtract 2x: 3x − 3 = 12.","Add 3: 3x = 15.","x = 5."]},
 {id:"L05e",stem:"If x² = 49 and x < 0, what is x?",ch:["−49","−24.5","−7","7","49"],a:2,hint:"Which two numbers square to 49? Then apply x < 0.",steps:["x = 7 or x = −7.","x < 0, so x = −7."]},
 {id:"L05f",stem:"If x² − 7x + 12 = 0, which of the following could be x?",ch:["−4","−3","2","4","7"],a:3,hint:"Find two numbers that multiply to 12 and add to 7.",traps:{1:"Watch the signs: the factor (x − 3) gives x = +3, not −3."},steps:["3 × 4 = 12 and 3 + 4 = 7.","(x − 3)(x − 4) = 0, so x = 3 or x = 4.","Only 4 is offered."]}]},
{id:"L06",t:"Turning words into equations",blurb:"The translation step most word problems hinge on.",match:{subs:["Word problems"]},
 c:[["Name the unknown","<p>Write “let x = …” in words before anything else. Most mistakes come from solving for the wrong quantity.</p>"],
  ["Translate phrase by phrase","<p>“is” → =, “of” → ×, “more than” → +, “per” → ÷. Careful with order: “5 less than x” is x − 5, not 5 − x.</p>"],
  ["One equation per fact","<p>Each sentence with a number usually becomes one equation. Then solve.</p>"],
  ["Check against the story","<p>Plug your answer back into the words. Does it make sense?</p>"]],
 ex:{q:"A consultant charges a $200 setup fee plus $75 per hour. The bill was $950. How many hours did the consultant work?",steps:[["Let h = hours worked.","Name exactly what the question asks for."],["Bill = 200 + 75h, so 200 + 75h = 950.","Fee plus rate × hours."],["75h = 750, so h = 10.","Check: 200 + 750 = 950."]]},
 traps:["Reversing “less than”: “7 less than 3x” is 3x − 7.","Finding one quantity when the question asks for another."],
 p:[
 {id:"L06a",stem:"Twice a number plus 8 is 30. What is the number?",ch:["7","11","15","19","22"],a:1,hint:"2x + 8 = 30.",steps:["2x + 8 = 30.","2x = 22, so x = 11."]},
 {id:"L06b",stem:"A gym charges a $40 joining fee plus $25 per month. After how many months will a member have paid $240 in total?",ch:["6","8","9.6","10","11"],a:1,hint:"40 + 25m = 240.",traps:{2:"9.6 divides 240 by 25 and ignores the joining fee."},steps:["40 + 25m = 240.","25m = 200, so m = 8."]},
 {id:"L06c",stem:"Ana is 6 years older than Ben. Their ages add up to 50. How old is Ben?",ch:["20","22","25","28","44"],a:1,hint:"Let b = Ben’s age. Then Ana is b + 6.",traps:{3:"28 is Ana’s age."},steps:["b + (b + 6) = 50.","2b = 44, so b = 22."]},
 {id:"L06d",stem:"A number decreased by 15 equals one-fourth of the number. What is the number?",ch:["5","12","15","20","60"],a:3,hint:"x − 15 = x/4. Multiply both sides by 4 to clear the fraction.",steps:["x − 15 = x/4.","Multiply by 4: 4x − 60 = x.","3x = 60, so x = 20."]},
 {id:"L06e",stem:"A store sold 120 items, some at $5 and the rest at $8, for $780 in total. How many $8 items were sold?",ch:["20","40","60","80","100"],a:2,hint:"Let e = the number of $8 items. Then 120 − e items cost $5.",steps:["5(120 − e) + 8e = 780.","600 + 3e = 780.","3e = 180, so e = 60."]},
 {id:"L06f",stem:"Seven less than three times a number is 20. What is the number?",ch:["4.3","6","9","13","27"],a:2,hint:"“Seven less than 3x” is 3x − 7.",steps:["3x − 7 = 20.","3x = 27, so x = 9."]}]},
{id:"L07",t:"Two equations, two unknowns",blurb:"Substitution and elimination, step by step.",match:{subs:["Algebra","Word problems"]},
 c:[["Why you need two equations","<p>One equation with two unknowns has endless answers. Two different equations pin both down.</p>"],
  ["Substitution","<p>Solve one equation for one letter and plug it into the other. Best when one equation is simple, like y = 2x or x + y = 9.</p>"],
  ["Elimination","<p>Add or subtract the equations so one letter cancels. Best when a letter has matching coefficients, like 3x + 5y = 190 and 3x + 11y = 310: subtracting removes x.</p>"],
  ["Answer the question asked","<p>You often need only one of the two values. Stop as soon as you have it.</p>"]],
 ex:{q:"x + y = 10 and x − y = 4. What is x?",steps:[["Add the equations: (x + y) + (x − y) = 10 + 4.","The y terms cancel."],["2x = 14, so x = 7.",""],["Then y = 3. Check: 7 − 3 = 4.",""]]},
 traps:["Solving for the wrong letter.","Subtracting only part of an equation; subtract every term."],
 p:[
 {id:"L07a",stem:"If x + y = 12 and x − y = 2, what is x?",ch:["5","6","7","10","14"],a:2,hint:"Add the two equations so y cancels.",steps:["Add: 2x = 14.","x = 7."]},
 {id:"L07b",stem:"If y = 2x and x + y = 18, what is y?",ch:["6","9","12","18","36"],a:2,hint:"Substitute 2x for y in the second equation.",traps:{0:"6 is x. The question asks for y."},steps:["x + 2x = 18, so x = 6.","y = 2 × 6 = 12."]},
 {id:"L07c",stem:"Adult tickets cost $10 and child tickets cost $6. A group bought 10 tickets for $80. How many adult tickets did it buy?",ch:["3","4","5","6","8"],a:2,hint:"a + c = 10 and 10a + 6c = 80. Substitute c = 10 − a.",steps:["10a + 6(10 − a) = 80.","60 + 4a = 80, so a = 5."]},
 {id:"L07d",stem:"If 2x + y = 11 and x + y = 7, what is x?",ch:["2","3","4","5","7"],a:2,hint:"Subtract the second equation from the first.",steps:["(2x + y) − (x + y) = 11 − 7.","x = 4."]},
 {id:"L07e",stem:"If 3x + 2y = 16 and x + 2y = 8, what is y?",ch:["1","2","3","4","5"],a:1,hint:"Subtract to find x first, then plug it in.",steps:["Subtract: 2x = 8, so x = 4.","4 + 2y = 8, so y = 2."]},
 {id:"L07f",stem:"2 pens and 3 notebooks cost $13. 4 pens and 1 notebook cost $11. What does one notebook cost?",ch:["$1","$2","$3","$4","$5"],a:2,hint:"Double the first equation so both have 4 pens, then subtract.",steps:["Double the first: 4p + 6n = 26.","Subtract 4p + n = 11: 5n = 15.","n = 3."]}]},
{id:"L08",t:"Rates and work",blurb:"Speed, combined work, and person-hours.",match:{subs:["Rates and work"]},
 c:[["Distance = rate × time","<p>Rearrange as needed: time = distance ÷ rate, and rate = distance ÷ time.</p>"],
  ["Average speed","<p>Total distance ÷ total time. Never the average of two speeds, because you spend more time at the slower one.</p>"],
  ["Work rates add","<p>Finishing a job in 6 hours means doing 1/6 of it per hour. For two workers together, add their rates. A drain subtracts.</p>"],
  ["Person-hours","<p>If 4 people take 6 days, the job is 24 person-days. So 8 people take 3 days. More people means fewer days.</p>"]],
 ex:{q:"Ann can finish a report in 3 hours and Bo can in 6 hours. How long do they take working together?",steps:[["Ann: 1/3 of the report per hour. Bo: 1/6 per hour.","Turn times into rates."],["Together: 1/3 + 1/6 = 2/6 + 1/6 = 1/2 per hour.","Rates add; times don’t."],["Time = 1 ÷ 1/2 = 2 hours.","Faster than either alone, as it should be."]]},
 traps:["Averaging two times or two speeds.","Scaling the wrong way: doubling the workers halves the time."],
 p:[
 {id:"L08a",stem:"A car travels 180 miles in 3 hours. What is its average speed in miles per hour?",ch:["45","54","60","90","540"],a:2,hint:"Rate = distance ÷ time.",steps:["180 ÷ 3 = 60."]},
 {id:"L08b",stem:"At 50 miles per hour, how long does a 125-mile trip take?",ch:["2 hours","2.5 hours","2.75 hours","3 hours","6.25 hours"],a:1,hint:"Time = distance ÷ rate.",steps:["125 ÷ 50 = 2.5 hours."]},
 {id:"L08c",stem:"A machine makes 40 units per hour. How many units does it make in 2.5 hours?",ch:["16","80","90","100","120"],a:3,hint:"Units = rate × time.",steps:["40 × 2.5 = 100."]},
 {id:"L08d",stem:"Pipe A fills a tank in 2 hours and pipe B in 6 hours. How long do they take together?",ch:["1.5 hours","2 hours","3 hours","4 hours","8 hours"],a:0,hint:"Add the rates: 1/2 + 1/6.",traps:{3:"4 hours averages the two times. Working together must be faster than either alone."},steps:["1/2 + 1/6 = 3/6 + 1/6 = 4/6 = 2/3 of the tank per hour.","Time = 1 ÷ 2/3 = 1.5 hours."]},
 {id:"L08e",stem:"5 workers finish a job in 12 days. At the same rate, how many days would 6 workers need?",ch:["8","10","12","14.4","15"],a:1,hint:"The job is 5 × 12 = 60 worker-days.",traps:{3:"14.4 scales the wrong way. More workers means fewer days."},steps:["Job: 5 × 12 = 60 worker-days.","60 ÷ 6 = 10 days."]},
 {id:"L08f",stem:"A cyclist rides 30 miles at 10 miles per hour and returns along the same route at 15 miles per hour. What is the average speed for the round trip?",ch:["11","12","12.5","13","25"],a:1,hint:"Find the total time for each leg first.",traps:{2:"12.5 averages the speeds, but more time is spent at the slower one."},steps:["Out: 30 ÷ 10 = 3 hours. Back: 30 ÷ 15 = 2 hours.","60 miles ÷ 5 hours = 12 mph."]}]},
{id:"L09",t:"Number properties",blurb:"Even and odd, divisibility, primes, and remainders.",match:{subs:["Number properties","Remainders"]},
 c:[["Even and odd","<p>Even ± even = even. Odd ± odd = even. Even ± odd = odd. A product is even if any factor is even.</p>"],
  ["Divisibility shortcuts","<p>By 2: last digit is even. By 3: digits add to a multiple of 3. By 5: ends in 0 or 5. By 9: digits add to a multiple of 9.</p>"],
  ["Primes and factors","<p>A prime has exactly two factors: 1 and itself. 2 is the only even prime, and 1 is not prime. Break numbers into primes: 72 = 2 × 2 × 2 × 3 × 3.</p>"],
  ["Remainders","<p>47 ÷ 6 = 7 remainder 5, because 47 = 6 × 7 + 5. The remainder is always smaller than the number you divide by.</p>"]],
 ex:{q:"Is 2,457 divisible by 9?",steps:[["Add the digits: 2 + 4 + 5 + 7 = 18.","The digit-sum rule works for 3 and 9."],["18 is a multiple of 9, so yes.","2,457 ÷ 9 = 273."]]},
 traps:["Calling 1 a prime number.","Forgetting that zero and negative numbers can be even integers too."],
 p:[
 {id:"L09a",stem:"If a is odd and b is even, which of the following must be odd?",ch:["ab","a + b","2a","b − 2","a × a × b"],a:1,hint:"Try a = 3 and b = 2 in each choice.",steps:["Odd + even = odd, so a + b is odd.","Each other choice includes an even factor or is even − even."]},
 {id:"L09b",stem:"Which number is prime?",ch:["1","21","29","33","51"],a:2,hint:"Check each for small factors like 3 and 7.",traps:{0:"1 isn’t prime. A prime needs exactly two factors."},steps:["21 = 3 × 7, 33 = 3 × 11, 51 = 3 × 17.","29 has no factors besides 1 and 29."]},
 {id:"L09c",stem:"What is the remainder when 47 is divided by 6?",ch:["1","3","5","7","41"],a:2,hint:"What is the largest multiple of 6 below 47?",steps:["6 × 7 = 42.","47 − 42 = 5."]},
 {id:"L09d",stem:"Which number is divisible by 3?",ch:["124","235","412","513","710"],a:3,hint:"Add each number’s digits.",steps:["5 + 1 + 3 = 9, a multiple of 3.","The others add to 7, 10, 7, and 8."]},
 {id:"L09e",stem:"How many positive factors does 12 have?",ch:["3","4","5","6","12"],a:3,hint:"List the pairs that multiply to 12.",steps:["1 × 12, 2 × 6, 3 × 4.","Factors: 1, 2, 3, 4, 6, 12. That’s six."]},
 {id:"L09f",stem:"Which shows 60 written as a product of primes?",ch:["2 × 30","2 × 2 × 15","2 × 2 × 3 × 5","3 × 4 × 5","2 × 3 × 10"],a:2,hint:"Keep splitting until every number is prime.",steps:["60 = 2 × 30 = 2 × 2 × 15 = 2 × 2 × 3 × 5.","Every factor in C is prime; the others contain 30, 15, 4, or 10."]}]},
{id:"L10",t:"Exponents and roots",blurb:"The handful of rules that cover nearly every exponent question.",match:{subs:["Exponents"]},
 c:[["What an exponent means","<p>2<sup>5</sup> = 2 × 2 × 2 × 2 × 2 = 32.</p>"],
  ["Rules for the same base","<p>Multiply: add the exponents (2<sup>3</sup> × 2<sup>4</sup> = 2<sup>7</sup>). Divide: subtract (2<sup>6</sup> ÷ 2<sup>2</sup> = 2<sup>4</sup>). Power of a power: multiply ((2<sup>3</sup>)<sup>2</sup> = 2<sup>6</sup>).</p>"],
  ["Zero and negative exponents","<p>Any nonzero number to the power 0 is 1. A negative exponent means “one over”: 2<sup>−2</sup> = 1/4.</p>"],
  ["Roots","<p>√49 = 7. Learn the squares from 1 to 15 (up to 225). √(a × b) = √a × √b, so √50 = √25 × √2 = 5√2. But √a + √b is not √(a + b).</p>"]],
 ex:{q:"Simplify 3<sup>4</sup> × 3<sup>2</sup> ÷ 3<sup>3</sup>.",steps:[["Multiply: add exponents, 4 + 2 = 6.","Same base, so the rules apply."],["Divide: subtract, 6 − 3 = 3.",""],["3<sup>3</sup> = 27.",""]]},
 traps:["Multiplying exponents when you should add them.","Adding square roots as if √a + √b = √(a + b)."],
 p:[
 {id:"L10a",stem:"What is 3<sup>4</sup>?",ch:["7","12","64","81","243"],a:3,hint:"Multiply 3 by itself four times.",traps:{1:"12 is 3 × 4. An exponent means repeated multiplication."},steps:["3 × 3 × 3 × 3 = 81."]},
 {id:"L10b",stem:"2<sup>3</sup> × 2<sup>5</sup> = ?",ch:["2<sup>8</sup>","2<sup>15</sup>","4<sup>8</sup>","4<sup>15</sup>","2<sup>2</sup>"],a:0,hint:"Same base, multiplying: add the exponents.",traps:{1:"Multiplying powers with the same base adds the exponents; it doesn’t multiply them."},steps:["3 + 5 = 8, so 2<sup>8</sup>."]},

const $=s=>document.querySelector(s);
const app=$("#app");
const Q={};BANK.forEach(q=>Q[q.id]=q);
const CQ={};CONCEPTS.forEach(c=>CQ[c.id]=c);
const KEY="ea-prep-v1";
const DAY=864e5,INT=[0,1,2,4,8,16];
function fresh(){return{v:1,settings:{goal:120,target:150},attempts:[],sessions:[],cards:{},tests:[],seenTest:{},inprog:null,flashReviews:0,perfect:false,qotd:null,qotdLog:[],recapSeen:null,learn:{},updatedAt:0};}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.v===1)return Object.assign(fresh(),x);}catch(e){}return fresh();}
let S=load();
let syncRef=null,syncTimer=null,syncState="device";
function save(){
  S.updatedAt=Date.now();
  if(S.attempts.length>1500)S.attempts=S.attempts.slice(-1500);
  if(S.sessions.length>500)S.sessions=S.sessions.slice(-500);
  if(S.tests.length>15)S.tests=S.tests.slice(-15);
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  if(syncRef){clearTimeout(syncTimer);syncTimer=setTimeout(pushRemote,2500);}
}
async function pushRemote(){if(!syncRef)return;try{await syncRef.set(JSON.parse(JSON.stringify(S)));syncState="synced";}catch(e){syncState="device";}}
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const db=await window.claude.use("db");const user=await window.claude.use("user");
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    syncRef=db.doc("data/users/"+uid+"/state");
    const snap=await syncRef.get();
    const r=snap.exists?snap.data():null;
    if(r&&r.v===1&&(r.updatedAt||0)>(S.updatedAt||0)){
      S=Object.assign(fresh(),r);try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
      if(["prep","test","progress"].includes(view))go(view);
    }else if(S.updatedAt&&(!r||S.updatedAt>(r.updatedAt||0))){await pushRemote();}
    syncState="synced";
  }catch(e){syncRef=null;syncState="device";}
})();

const L="ABCDE";
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const flashable=q=>!q.stim;
const SHUF=new Set(["CR","RC"]);
function permFor(q){return q.ch&&SHUF.has(q.type)?shuffle(q.ch.map((_,i)=>i)):null;}
function groupShuffle(qs){const groups=[],idx={};qs.forEach(q=>{const k=q.stim||("~"+q.id);if(idx[k]==null){idx[k]=groups.length;groups.push([]);}groups[idx[k]].push(q);});return shuffle(groups).flat();}
const posOf=(perm,i)=>perm?perm.indexOf(i):i;
function isComplete(q,r){if(r==null)return false;if(q.kind==="tpa")return r[0]!=null&&r[1]!=null;if(q.parts)return Array.isArray(r)&&q.parts.every((p,k)=>r[k]!=null);return typeof r==="number";}
function isCorrect(q,r){if(r==null)return false;if(q.kind==="tpa")return Array.isArray(r)&&r[0]===q.a[0]&&r[1]===q.a[1];if(q.parts)return Array.isArray(r)&&q.parts.every((p,k)=>r[k]===p.a);return r===q.a;}
function logAttempt(q,ok,secs,m){S.attempts.push({q:q.id,ok:ok?1:0,s:Math.round(Math.min(secs,300)),m,t:Date.now()});}
function logSession(k,secs){if(secs<10)return;S.sessions.push({k,s:Math.round(Math.min(secs,5400)),t:Date.now()});}
function cardMiss(id){const k="q:"+id,c=S.cards[k]||{b:0,n:0};c.b=0;c.due=Date.now();S.cards[k]=c;}
function gradeCard(k,ok){const c=S.cards[k]||{b:0,n:0};c.b=ok?Math.min(5,c.b+1):0;c.due=Date.now()+(ok?INT[c.b]*DAY:10*60e3);c.n=(c.n||0)+1;S.cards[k]=c;S.flashReviews=(S.flashReviews||0)+1;}
function typeStats(type){const a=S.attempts.filter(x=>Q[x.q]&&Q[x.q].type===type).slice(-12);const n=a.length,c=a.filter(x=>x.ok).length;return{n,c,acc:n?c/n:0};}
function level(st){if(st.n<3)return{k:0,label:"Not enough answers yet"};if(st.acc>=.8&&st.n>=6)return{k:3,label:"Strong"};if(st.acc>=.6)return{k:2,label:"Steady"};return{k:1,label:"Building"};}
function secStats(sec){const a=S.attempts.filter(x=>Q[x.q]&&Q[x.q].sec===sec).slice(-20);const n=a.length;return{n,acc:n?a.filter(x=>x.ok).length/n:0};}
function suggestSection(){let best="IR",bv=9;ORDER.forEach(s=>{const st=secStats(s);const v=st.n<5?-1+st.n/10:st.acc;if(v<bv){bv=v;best=s;}});return best;}
function weekKey(t){const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime();}
function minutesByWeek(){const m={};S.sessions.forEach(s=>{const k=weekKey(s.t);m[k]=(m[k]||0)+s.s/60;});return m;}
function weekMinutes(){return Math.round(minutesByWeek()[weekKey(Date.now())]||0);}
function weekStreak(){const m=minutesByWeek(),g=S.settings.goal;let n=0;const d=new Date(weekKey(Date.now()));if((m[d.getTime()]||0)>=g)n++;for(let i=0;i<260;i++){d.setDate(d.getDate()-7);if((m[d.getTime()]||0)>=g)n++;else break;}return n;}
function dueInfo(deck){const now=Date.now();let due=0,nw=0;const keys=deckKeys(deck);keys.forEach(k=>{const c=S.cards[k];if(!c)nw++;else if(c.due<=now)due++;});return{due,nw};}
function deckKeys(deck){const cs=CONCEPTS.map(c=>"c:"+c.id);if(deck==="c")return cs;return BANK.filter(flashable).map(q=>"q:"+q.id).concat(cs);}
function ringSVG(v,g){const p=Math.min(1,v/Math.max(1,g)),r=24,c=2*Math.PI*r;return`<svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--line)" stroke-width="7"/><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--ok)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" transform="rotate(-90 32 32)"/><text x="32" y="37" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)" font-family="Public Sans, sans-serif">${Math.round(p*100)}%</text></svg>`;}

const UI={sort:{},tab:{}};
const num=v=>{const n=parseFloat(String(v).replace("−","-").replace(/[^0-9.\-]/g,""));return isNaN(n)?null:n;};
function tableHTML(t,key){let rows=t.rows.slice();const s=UI.sort[key];if(s){rows.sort((a,b)=>{const x=num(a[s.c]),y=num(b[s.c]);const r=(x!=null&&y!=null)?x-y:String(a[s.c]).localeCompare(String(b[s.c]));return r*s.d;});}

function stimInner(id){const s=STIM[id];
  if(s.kind==="text")return`<p class="slabel">${s.title}</p><div class="passage">${s.html}</div>`;
  if(s.kind==="table")return`<p class="slabel">${s.title}</p><p class="small">Tap a column heading to sort.</p>${tableHTML(s,id)}`;
  if(s.kind==="bars"){const max=Math.max(...s.data.map(d=>d[1]));return`<p class="slabel">${s.title}</p><div class="bars">${s.data.map(([l,v])=>`<div class="bar"><span>${l}</span><span class="bt"><span class="bf" style="width:${v/max*100}%"></span></span><span class="bv">${v}${s.suffix}</span></div>`).join("")}</div>${s.note?`<p class="small" style="margin-top:8px">${s.note}</p>`:""}`;}
  if(s.kind==="tabs"){const ti=UI.tab[id]||0,tab=s.tabs[ti];return`<div class="tabbar" role="tablist">${s.tabs.map((t,i)=>`<button role="tab" aria-selected="${i===ti}" class="${i===ti?"on":""}" data-tab="${i}">${t.name}</button>`).join("")}</div><div class="tabpanel">${tab.table?tableHTML(tab.table,id+"t"+ti):`<div class="passage">${tab.html}</div>`}</div>`;}
  return"";}

  if(q.type==="DS")h+=`<div class="ds"><div><b>(1)</b>${q.s1}</div><div><b>(2)</b>${q.s2}</div></div>`;
  h+="</div>";
  if(q.kind==="yn"){h+=`<p class="intro">${q.intro||"For each statement, select Yes if it is supported by the information provided. Otherwise, select No."}</p>`+q.parts.map((p,k)=>{const opts=p.o||YN;return`<div class="ynrow"><p>${p.t}</p><div class="seg" role="group" aria-label="Statement ${k+1}">${opts.map((t,i)=>{let c="";const chosen=r&&r[k]===i;if(chosen&&!o.show)c=" sel";if(o.show){if(i===p.a)c=" right";else if(chosen)c=" wrong";}return`<button class="segb${c}" data-k="${k}" data-i="${i}" aria-pressed="${!!chosen}" ${dis}>${t}</button>`;}).join("")}</div></div>`;}).join("");}
  else if(q.kind==="tpa"){h+=`<div class="tblwrap"><table class="tpa"><thead><tr><th>${q.cols[0]}</th><th>${q.cols[1]}</th><th></th></tr></thead><tbody>${q.o.map((t,i)=>`<tr>${[0,1].map(c=>{const chosen=r&&r[c]===i;let cl=chosen&&!o.show?" sel":"";if(o.show){if(q.a[c]===i)cl=" right"+(chosen?" sel":"");else if(chosen)cl=" wrong sel";}return`<td><button class="tp${cl}" data-c="${c}" data-i="${i}" aria-label="${q.cols[c]}: ${t.replace(/"/g,"")}" aria-pressed="${!!chosen}" ${dis}></button></td>`;}).join("")}<td>${t}</td></tr>`).join("")}</tbody></table></div>`;}
  else if(q.kind!=="gi"){const ch=q.type==="DS"?DS_CH:q.ch;const ord=o.perm||ch.map((_,i)=>i);h+=ord.map((i,pos)=>{const t=ch[i];let c="";const chosen=r===i;if(chosen&&!o.show)c=" sel";if(o.show){if(i===q.a)c=" right";else if(chosen)c=" wrong";}return`<button class="ch${c}" data-i="${i}" aria-pressed="${chosen}" ${dis}><span class="lt">${L[pos]}</span><span>${t}</span></button>`;}).join("");}
  return h;}
function bindQA(q,get,set,opts){const qa=$("#qa");
  qa.onclick=e=>{const b=e.target.closest(".ch,.segb,.tp");if(!b||b.disabled)return;let r=get();
    if(b.classList.contains("ch"))r=+b.dataset.i;
    else if(b.classList.contains("segb")){r=Array.isArray(r)?r.slice():q.parts.map(()=>null);r[+b.dataset.k]=+b.dataset.i;}
    else{r=Array.isArray(r)?r.slice():[null,null];r[+b.dataset.c]=+b.dataset.i;}
    set(r);qa.innerHTML=qaHTML(q,r,{perm:opts&&opts.perm});};
  qa.onchange=e=>{const s=e.target.closest("select.gi");if(!s)return;let r=get();r=Array.isArray(r)?r.slice():q.parts.map(()=>null);r[+s.dataset.k]=s.value===""?null:+s.value;set(r);};}
function answerText(q,perm){if(q.kind==="yn")return q.parts.map((p,k)=>`statement ${k+1}, ${(p.o||YN)[p.a]}`).join("; ");if(q.kind==="gi")return q.parts.map((p,k)=>`blank ${k+1}, ${p.o[p.a]}`).join("; ");if(q.kind==="tpa")return`${q.cols[0]}: ${q.o[q.a[0]]}. ${q.cols[1]}: ${q.o[q.a[1]]}`;const ch=q.type==="DS"?DS_CH:q.ch;return`${L[posOf(perm,q.a)]}. ${ch[q.a]}`;}
function explainHTML(q,r,ok,skipped,perm){const steps=`<ol class="steps">${q.steps.map(s=>`<li>${s}</li>`).join("")}</ol>`;
  let h=`<div class="fb ${ok?"good":"miss"}" id="fbk" tabindex="-1"><p class="verdict">${ok?"Correct.":skipped?"Here’s how to work it out.":"Not quite."}</p>`;
  if(!ok){if(typeof r==="number"&&q.traps&&q.traps[r])h+=`<p class="trap"><b>Why ${L[posOf(perm,r)]} is tempting: </b>${q.traps[r]}</p>`;h+=`<p><b>Correct answer: </b>${answerText(q,perm)}</p><p class="how">How to reason through it</p>${steps}`;}
  else h+=`<details><summary>See the reasoning</summary>${steps}</details>`;
  if(!ok){const ls=lessonsFor(q);if(ls.length)h+=`<p class="small" style="margin-top:12px">Want to build this skill from the ground up? ${ls.map(l=>`<button class="linkbtn" data-learn="${l.id}">Lesson ${l.n}: ${l.t}</button>`).join("")}</p>`;}
  return h+"</div>";}

/* ================= question of the day & weekly recap ================= */
function dayKey(t){const d=new Date(t);d.setHours(0,0,0,0);return d.getTime();}
let qotdStart=Date.now();
function getQotd(){const dk=dayKey(Date.now());
  if(!S.qotd||S.qotd.day!==dk||!Q[S.qotd.id]){const last={};S.attempts.forEach(a=>last[a.q]=a);
    const recent=new Set((S.qotdHist||[]).slice(-14));
    const cand=BANK.filter(flashable).map(q=>{const a=last[q.id];let s=Math.random();if(!a)s-=.6;else if(!a.ok)s-=1;else s+=1;if(recent.has(q.id))s+=3;return{q,s};}).sort((a,b)=>a.s-b.s);
    const q=cand[0].q;S.qotd={day:dk,id:q.id,r:null,done:false,ok:false,perm:permFor(q)};S.qotdHist=(S.qotdHist||[]).concat(q.id).slice(-30);save();}
  return S.qotd;}
function qotdDays(){const days=new Set(S.qotdLog||[]),now=dayKey(Date.now());let n=0;for(let i=0;i<7;i++){const d=new Date(now);d.setDate(d.getDate()-i);if(days.has(d.getTime()))n++;}return n;}
function qotdCard(){const qd=getQotd(),q=Q[qd.id],ok=qd.done&&isCorrect(q,qd.r);
  return`<h2>Question of the day</h2><div class="tbar"><span class="small">${TYPES[q.type].n}, ${q.sub}. Answered ${qotdDays()} of the last 7 days.</span>${qd.done?"":toolsHTML(q)}</div><div class="qa" id="qa">${qaHTML(q,qd.r,{locked:qd.done,show:qd.done,perm:qd.perm})}</div>${qd.done?explainHTML(q,qd.r,ok,false,qd.perm)+`<p class="small">A new question appears tomorrow.</p>`:`<div class="row"><button class="btn primary" data-act="qcheck" id="chk" ${isComplete(q,qd.r)?"":"disabled"}>Check answer</button></div>`}`;}
function mountQotd(){const box=$("#qotd");if(!box)return;box.innerHTML=qotdCard();const qd=S.qotd,q=Q[qd.id];
  if(!qd.done)bindQA(q,()=>qd.r,r=>{qd.r=r;$("#chk").disabled=!isComplete(q,r);},{perm:qd.perm});}
function qotdCheck(){const qd=S.qotd,q=Q[qd.id],ok=isCorrect(q,qd.r),secs=(Date.now()-qotdStart)/1000;qd.done=true;qd.ok=ok;
  logAttempt(q,ok,secs,"d");logSession("qotd",Math.min(300,secs));if(!ok)cardMiss(q.id);
  S.qotdLog=(S.qotdLog||[]).filter(d=>d>Date.now()-30*DAY).concat(qd.day);save();mountQotd();}
function prevWeek(wk){const d=new Date(wk);d.setDate(d.getDate()-7);return d.getTime();}
const wkLabel=wk=>new Date(wk).toLocaleDateString(undefined,{month:"short",day:"numeric"});
function weekSummary(wk){const at=S.attempts.filter(a=>weekKey(a.t)===wk);const mins=Math.round(S.sessions.filter(s=>weekKey(s.t)===wk).reduce((x,s)=>x+s.s,0)/60);
  const n=at.length,c=at.filter(a=>a.ok).length,by={};at.forEach(a=>{const q=Q[a.q];if(!q)return;const t=by[q.type]||(by[q.type]={n:0,c:0});t.n++;if(a.ok)t.c++;});
  const rated=Object.keys(by).filter(t=>by[t].n>=3).map(t=>({t,n:by[t].n,c:by[t].c,acc:by[t].c/by[t].n})).sort((a,b)=>b.acc-a.acc||b.n-a.n);
  const worst=rated.length>1&&rated[rated.length-1].acc<rated[0].acc?rated[rated.length-1]:null;
  return{wk,mins,n,c,acc:n?c/n:0,best:rated[0]||null,worst,tests:S.tests.filter(t=>weekKey(t.date)===wk)};}
function recapHTML(sm,title,cur){const pv=weekSummary(prevWeek(sm.wk)),g=S.settings.goal;
  if(!sm.n&&!sm.mins)return`<h2>${title}</h2><p class="sub">No study time ${cur?"yet this week":"that week"}.</p>`;
  let h=`<h2>${title}</h2><p>${sm.mins} minutes studied${cur?" so far":""} against a ${g}-minute goal${sm.mins>=g?", goal met":""}. ${sm.n} ${sm.n===1?"question":"questions"} answered, ${Math.round(sm.acc*100)}% correct.</p>`;
  if(pv.n&&sm.n){const dm=sm.mins-pv.mins,da=Math.round((sm.acc-pv.acc)*100);h+=`<p class="delta">Compared with the week before: ${dm>=0?"+":"−"}${Math.abs(dm)} minutes, ${da>=0?"+":"−"}${Math.abs(da)} points of accuracy.</p>`;}
  if(sm.best)h+=`<p>Strongest: ${TYPES[sm.best.t].n}, ${sm.best.c} of ${sm.best.n}.${sm.worst?` Needs work: ${TYPES[sm.worst.t].n}, ${sm.worst.c} of ${sm.worst.n}.`:""}</p>`;
  else if(sm.n)h+=`<p class="delta">Answer at least 3 questions of a type to see your strongest and weakest.</p>`;
  if(sm.tests.length)h+=`<p>Practice ${sm.tests.length===1?"test":"tests"}: ${sm.tests.map(t=>t.total).join(", ")}.</p>`;
  return h;}

/* ---------- prep sessions (mini-module and drill) ---------- */
let P=null;
function pickIds(filter,n,target){const last={};S.attempts.forEach(a=>last[a.q]=a);
  const scored=BANK.filter(filter).map(q=>{const a=last[q.id];let s=Math.random()*.8;
    if(a)s+=a.ok?1.5+Math.max(0,1-(Date.now()-a.t)/(7*DAY)):.5;
    const st=typeStats(q.type);s-=(st.n?1-st.acc:.3)*.6;
    if(target!=null)s+=Math.abs(q.d-target)*.5;
    return{q,s};}).sort((a,b)=>a.s-b.s).slice(0,n).map(x=>x.q);
  return groupShuffle(scored).map(q=>q.id);}
function startPrep(kind,arg){const n=kind==="mini"?SECS[arg].mods[0]:8;
  const ids=pickIds(kind==="mini"?q=>q.sec===arg:kind==="topic"?q=>lessonMatch(LES[arg],q):q=>q.type===arg,n);
  if(!ids.length){toast("No questions of that type yet.");return;}
  P={kind,arg,ids,perms:Object.fromEntries(ids.map(id=>[id,permFor(Q[id])])),i:0,r:null,checked:false,skipped:false,left:kind==="mini"?900:null,over:false,start:Date.now(),qStart:Date.now(),res:[],logged:false};
  go("session");}
VIEWS.session=()=>{setMode("prep");showNav(false);const id=P.ids[P.i],q=Q[id];
  setHeader(`<button class="hbtn" data-act="end">End</button>`,`<span class="tsec">${P.i+1} of ${P.ids.length}</span>${P.left!=null?`<span id="timer" class="timer${P.over?" low":""}">${P.over?"Over time":mmss(P.left)}</span>`:""}`);
  const ok=P.checked&&isCorrect(q,P.r);
  app.innerHTML=`<div class="tbar"><span class="qtype" style="margin:0">${TYPES[q.type].n}, ${q.sub}</span>${toolsHTML(q)}</div>${stimBox(q)}<div class="qa" id="qa">${qaHTML(q,P.r,{locked:P.checked,show:P.checked,perm:P.perms[id]})}</div>${P.checked?explainHTML(q,P.r,ok,P.skipped,P.perms[id]):""}
  <div class="dock">${P.checked?`<button class="btn primary wide" data-act="next">${P.i===P.ids.length-1?"See summary":"Next question"}</button>`:`<button class="btn" data-act="skip">Show me how</button><button class="btn primary" data-act="check" id="chk" ${isComplete(q,P.r)?"":"disabled"}>Check answer</button>`}</div>`;
  if(!P.checked)bindQA(q,()=>P.r,r=>{P.r=r;$("#chk").disabled=!isComplete(q,r);},{perm:P.perms[id]});
  const grade=skipped=>{const ok=!skipped&&isCorrect(q,P.r);P.skipped=skipped;const secs=(Date.now()-P.qStart)/1000;
    logAttempt(q,ok,secs,"p");if(!ok&&flashable(q))cardMiss(q.id);P.res.push({id,ok,secs,r:P.r,p:P.perms[id]});P.checked=true;save();
    VIEWS.session();const f=$("#fbk");if(f){f.scrollIntoView({block:"start",behavior:"smooth"});f.focus({preventScroll:true});}};
  ACT.check=()=>grade(false);
  ACT.calc=()=>toggleCalc();ACT.scratch=()=>openScratch();
  ACT.skip=()=>grade(true);
  ACT.next=()=>{if(P.i===P.ids.length-1){go("psum");return;}P.i++;P.r=null;P.checked=false;P.skipped=false;P.qStart=Date.now();go("session");};
  ACT.end=async()=>{if(!P.res.length||await confirmBox("End this session?","Your answers so far are saved.","End session","Keep going"))go(P.res.length?"psum":"prep");};
  clearInterval(timer);timer=null;if(P.left!=null&&!P.over){timer=setInterval(()=>{if(P.checked||P.over)return;P.left--;const t=$("#timer");if(t)t.textContent=mmss(P.left);if(P.left<=0){P.over=true;clearInterval(timer);if(t){t.textContent="Over time";t.classList.add("low");}toast("15 minutes are up. Finish at your own pace; your pacing shows in the summary.");}},1000);}
};
VIEWS.psum=()=>{setMode("prep");showNav(false);
  if(!P.logged){P.logged=true;logSession(P.kind,(Date.now()-P.start)/1000);if(P.kind==="mini"&&P.res.length>=6&&P.res.every(r=>r.ok))S.perfect=true;save();}
  const c=P.res.filter(r=>r.ok).length,n=P.res.length,avg=n?P.res.reduce((a,r)=>a+r.secs,0)/n:0;

  <div class="dock"><button class="btn" data-act="home">Back to prep</button>${weakT?`<button class="btn primary" data-act="drill">Drill ${TYPES[weakT].n}</button>`:""}</div>`;
  ACT.view=b=>{const r=P.res[+b.dataset.i];go("qview",{id:r.id,r:r.r,perm:r.p,back:"psum"});};

};
VIEWS.qview=a=>{const q=a.q||Q[a.id],ok=isCorrect(q,a.r);setMode(a.back==="tresult"?"test":"prep");showNav(false);

/* ---------- flashcards ---------- */
let F=null;
function startFlash(deck){const now=Date.now(),due=[],nw=[];
  deckKeys(deck).forEach(k=>{const c=S.cards[k];if(!c)nw.push(k);else if(c.due<=now)due.push(k);});
  due.sort((a,b)=>S.cards[a].due-S.cards[b].due);shuffle(nw);
  const queue=due.slice(0,12);while(queue.length<12&&nw.length)queue.push(nw.shift());shuffle(queue);
  if(!queue.length){toast("Nothing due right now. Try a drill instead.");return;}
  F={queue,perms:{},i:0,r:null,checked:false,flipped:false,start:Date.now(),qStart:Date.now(),ok:0};go("flash");}
VIEWS.flash=()=>{setMode("prep");showNav(false);const key=F.queue[F.i],[kind,id]=key.split(":");
  setHeader(`<button class="hbtn" data-act="end">Done</button>`,`<span class="tsec">Card ${F.i+1} of ${F.queue.length}</span>`);
  const last=F.i===F.queue.length-1;
  if(kind==="c"){const c=CQ[id];
    app.innerHTML=`<div class="fcard"><p class="topic">${c.topic}</p><p class="front">${c.front}</p>${F.flipped?`<p class="back">${c.back}</p>`:""}</div>
    <div class="dock">${F.flipped?`<button class="btn" data-act="again">Again soon</button><button class="btn primary" data-act="got">Got it</button>`:`<button class="btn primary wide" data-act="flip">Show answer</button>`}</div>`;
    ACT.flip=()=>{F.flipped=true;VIEWS.flash();};
    const rate=ok=>{gradeCard(key,ok);if(ok)F.ok++;save();nextCard();};
    ACT.again=()=>rate(false);ACT.got=()=>rate(true);
  }else{const q=Q[id],ok=F.checked&&isCorrect(q,F.r);if(!(key in F.perms))F.perms[key]=permFor(q);const perm=F.perms[key];
    app.innerHTML=`<div class="tbar"><span class="qtype" style="margin:0">Quick question: ${TYPES[q.type].n}</span>${toolsHTML(q)}</div><div class="qa" id="qa">${qaHTML(q,F.r,{locked:F.checked,show:F.checked,perm})}</div>${F.checked?explainHTML(q,F.r,ok,false,perm):""}
    <div class="dock">${F.checked?`<button class="btn primary wide" data-act="nx">${last?"Finish":"Next card"}</button>`:`<button class="btn primary wide" data-act="check" id="chk" ${isComplete(q,F.r)?"":"disabled"}>Check answer</button>`}</div>`;
    if(!F.checked)bindQA(q,()=>F.r,r=>{F.r=r;$("#chk").disabled=!isComplete(q,r);},{perm});
    ACT.check=()=>{const good=isCorrect(q,F.r);logAttempt(q,good,(Date.now()-F.qStart)/1000,"f");gradeCard(key,good);if(good)F.ok++;F.checked=true;save();VIEWS.flash();const f=$("#fbk");if(f)f.scrollIntoView({block:"start",behavior:"smooth"});};
    ACT.nx=nextCard;ACT.calc=()=>toggleCalc();ACT.scratch=()=>openScratch();}
  ACT.end=()=>endFlash();};
function nextCard(){if(F.i>=F.queue.length-1){endFlash();return;}F.i++;F.r=null;F.checked=false;F.flipped=false;F.qStart=Date.now();go("flash");}
function endFlash(){logSession("flash",(Date.now()-F.start)/1000);save();const n=F.i+(F.checked||F.flipped?1:0);toast(`Round done: ${F.ok} of ${Math.max(n,F.ok)} right.`);go("prep");}

/* ---------- practice test ---------- */
let T=null;
function curSec(){return ORDER[T.si];}
function curMod(){return T.mods[curSec()][T.mi];}
function buildMod(sec,m,hard){const n=SECS[sec].mods[m],target=m===0?3:(hard?4.3:2.3);
  const scored=BANK.filter(q=>q.sec===sec&&!T.used.includes(q.id)).map(q=>({q,s:Math.abs(q.d-target)+(S.seenTest[q.id]||0)*.8+Math.random()*.9})).sort((a,b)=>a.s-b.s).slice(0,n).map(x=>x.q);
  const ids=groupShuffle(scored).map(q=>q.id);T.used.push(...ids);T.perm=T.perm||{};ids.forEach(id=>T.perm[id]=permFor(Q[id]));return ids;}
VIEWS.test=()=>{setMode("test");showNav(true,"test");T=S.inprog;

  ${T?`<section class="sheet"><h2>Test in progress</h2><p>You’re in ${SECS[curSec()].name}${T.phase==="section"?" (not started)":`, module ${T.mi+1}`}, with ${mmss(T.left[curSec()])} left in that section.</p><div class="row"><button class="btn primary" data-act="resume">Resume test</button><button class="btn" data-act="discard">Discard</button></div></section>`:`
  <section class="sheet"><h2>Full Executive Assessment</h2><p>40 questions in three 30-minute sections, 90 minutes in total.</p>
  <ul class="rules"><li>Sections run in order: Integrated Reasoning, Verbal, then Quant.</li><li>Each section has two modules. You can move around and change answers inside a module, but it locks when you finish it.</li><li>Your first module decides whether the second is harder or standard.</li><li>The calculator is available in Integrated Reasoning only.</li><li>Unanswered questions count as wrong.</li></ul>
  <div class="row"><button class="btn primary wide" data-act="start">Start the test</button></div></section>`}

  ${S.tests.length?`<ul class="rlist">${S.tests.map((t,i)=>({t,i})).reverse().map(({t,i})=>`<li><button data-act="res" data-i="${i}"><span class="t">${new Date(t.date).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}</span><span class="s">IR ${t.sec.IR.score}, V ${t.sec.V.score}, Q ${t.sec.Q.score}</span><b style="margin-left:10px">${t.total}</b></button></li>`).join("")}</ul>`:`<p class="sub">No tests yet. Your first one gives you a baseline.</p>`}
  <p class="small" style="margin-top:20px">The question bank has ${BANK.length} questions, and a test uses 40, so repeat tests will reuse questions until the bank grows. Scores are estimates; use GMAC’s official practice assessments to calibrate.</p>`;
  ACT.start=()=>{T={si:0,mi:0,qi:0,phase:"section",mods:{},path:{},resp:{},flags:{},left:{IR:1800,V:1800,Q:1800},qt:{},used:[],started:Date.now()};S.inprog=T;save();go("tsection");};
  ACT.resume=()=>go(T.phase==="section"?"tsection":T.phase==="review"?"treview":"tq");

};
VIEWS.tsection=()=>{setMode("test");showNav(false);const sec=curSec(),s=SECS[sec];
  setHeader(`<button class="hbtn" data-act="pause">Save and exit</button>`,`<span class="tsec">Section ${T.si+1} of 3</span>`);
  app.innerHTML=`<h1>${s.name}</h1><section class="sheet"><p>${s.mods[0]+s.mods[1]} questions in two modules of ${s.mods[0]}. 30 minutes for the whole section.</p><p>${s.calc?"An on-screen calculator is available in this section.":"No calculator in this section. Use the scratchpad."}</p><p class="small">The clock starts when you begin.</p></section>
  <div class="dock"><button class="btn primary wide" data-act="begin">Begin section</button></div>`;
  ACT.begin=()=>{if(!T.mods[sec])T.mods[sec]=[buildMod(sec,0,null)];T.mi=0;T.qi=0;T.phase="q";save();go("tq");};
  ACT.pause=()=>{save();go("test");};};
function testHeader(){const sec=curSec();setHeader(`<button class="hbtn" data-act="pause">Save and exit</button>`,`<span class="tsec">${SECS[sec].short}, module ${T.mi+1}</span><span id="timer" class="timer${T.left[sec]<=300?" low":""}">${mmss(T.left[sec])}</span>`);}
function testTimer(){clearInterval(timer);timer=setInterval(()=>{const sec=curSec();T.left[sec]--;
  if(view==="tq"){const id=curMod()[T.qi];T.qt[id]=(T.qt[id]||0)+1;}
  const el=$("#timer");if(el){el.textContent=mmss(T.left[sec]);el.classList.toggle("low",T.left[sec]<=300);}
  if(T.left[sec]%10===0)save();
  if(T.left[sec]<=0){clearInterval(timer);timeUp();}},1000);}
function timeUp(){const sec=curSec();if(T.mi===0){T.path[sec]=false;T.mods[sec][1]=buildMod(sec,1,false);}toast(`Time’s up for ${SECS[sec].name}. Unanswered questions count as wrong.`);nextSection();}
function finishModule(){const sec=curSec();
  if(T.mi===0){const c=curMod().filter(id=>isCorrect(Q[id],T.resp[id])).length;T.path[sec]=c>=SECS[sec].thr;T.mods[sec][1]=buildMod(sec,1,T.path[sec]);T.mi=1;T.qi=0;T.phase="q";save();go("tq");}
  else nextSection();}
function nextSection(){T.si++;T.mi=0;T.qi=0;if(T.si>=3){finishTest();return;}T.phase="section";save();go("tsection");}
async function confirmFinish(){const mod=curMod(),un=mod.filter(id=>!isComplete(Q[id],T.resp[id])).length;
  if(await confirmBox(`Finish module ${T.mi+1}?`,`You won’t be able to return to these questions.${un?` ${un} ${un===1?"question is":"questions are"} unanswered and will count as wrong.`:""}`,"Finish module","Keep working"))finishModule();}
VIEWS.tq=()=>{setMode("test");showNav(false);T.phase="q";const sec=curSec(),mod=curMod(),id=mod[T.qi],q=Q[id];testHeader();
  app.innerHTML=`<div class="tbar"><span>Question ${T.qi+1} of ${mod.length}</span><span class="tools">${SECS[sec].calc?`<button class="tool" data-act="calc">Calculator</button>`:""}<button class="tool" data-act="scratch">Scratchpad</button><button class="tool${T.flags[id]?" on":""}" data-act="flag" aria-pressed="${!!T.flags[id]}">${T.flags[id]?"Flagged":"Flag"}</button></span></div>

VIEWS.treview=()=>{setMode("test");showNav(false);T.phase="review";const mod=curMod();testHeader();

  app.innerHTML=`<h1>Review module ${T.mi+1}</h1><p class="sub">${mod.length-un} answered, ${un} unanswered, ${fl} flagged. Tap a question to go back to it.</p>
  <div class="grid">${mod.map((id,i)=>{const a=isComplete(Q[id],T.resp[id]);return`<button class="cell${a?" ans":""}${T.flags[id]?" flag":""}" data-act="jump" data-i="${i}">${i+1}<small>${a?"Answered":"Open"}${T.flags[id]?", flagged":""}</small></button>`;}).join("")}</div>
  <div class="dock"><button class="btn" data-act="back">Return to questions</button><button class="btn primary" data-act="finish">Finish module</button></div>`;
  ACT.jump=b=>{T.qi=+b.dataset.i;go("tq");};ACT.back=()=>go("tq");ACT.finish=confirmFinish;ACT.pause=()=>{save();go("test");};
  testTimer();};
function finishTest(){const res={date:Date.now(),sec:{},items:[]};let sum=0,used=0;
  ORDER.forEach(sec=>{const m1=T.mods[sec][0],m2=T.mods[sec][1]||[];const cnt=ids=>ids.filter(id=>isCorrect(Q[id],T.resp[id])).length;
    const c1=cnt(m1),c2=cnt(m2),a1=c1/m1.length,a2=m2.length?c2/m2.length:0,hard=!!T.path[sec];
    let sc=hard?6+6*a1+8*a2:2+8*a1+6*a2;sc=Math.max(0,Math.min(20,Math.round(sc)));sum+=sc;
    const ids=m1.concat(m2),time=ids.reduce((a,id)=>a+(T.qt[id]||0),0);used+=1800-Math.max(0,T.left[sec]);
    res.sec[sec]={score:sc,c1,n1:m1.length,c2,n2:m2.length,hard,avg:Math.round(time/Math.max(1,ids.length))};
    ids.forEach((id,k)=>{const ok=isCorrect(Q[id],T.resp[id]);res.items.push({q:id,ok:ok?1:0,r:T.resp[id]==null?null:T.resp[id],p:(T.perm||{})[id]||null,s:T.qt[id]||0,sec,m:k<m1.length?1:2});
      logAttempt(Q[id],ok,T.qt[id]||0,"t");S.seenTest[id]=(S.seenTest[id]||0)+1;if(!ok&&flashable(Q[id]))cardMiss(id);});});
  res.total=Math.round(100+sum*100/60);logSession("test",used);S.tests.push(res);S.inprog=null;T=null;save();go("tresult",S.tests.length-1);}
